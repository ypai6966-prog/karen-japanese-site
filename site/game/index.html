</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="960" height="540" aria-label="日文打字遊戲畫面"></canvas>
<input id="kb" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="latin" aria-label="打字輸入">
</div>
<script>
'use strict';
/* =========================================================
   記事簿妖怪退治（試玩版）
   - 畫面：320x180 像素世界放大 3 倍，文字用 DotGothic16 直接畫在 960x540
   - 輸入：羅馬拼音，支援 shi/si、tsu/tu、n/nn 等多種拼法
   ========================================================= */

/* ---------- 單字庫 ---------- */
const STAGE1_WORDS = [
  ['あ','あめ','雨'],['い','いぬ','狗'],['う','うみ','海'],['え','えき','車站'],['お','おちゃ','茶'],
  ['か','かさ','傘'],['き','き','樹'],['く','くつ','鞋子'],['け','けむり','煙'],['こ','こども','小孩'],
  ['さ','さかな','魚'],['し','しお','鹽'],['す','すし','壽司'],['せ','せんせい','老師'],['そ','そら','天空'],
  ['た','たまご','蛋'],['ち','ちず','地圖'],['つ','つき','月亮'],['て','て','手'],['と','とり','鳥'],
  ['な','なつ','夏天'],['に','にく','肉'],['ね','ねこ','貓'],['の','のり','海苔'],['は','はな','花'],
  ['ひ','ひかり','光'],['ふ','ふね','船'],['ほ','ほし','星星'],['ま','まど','窗戶'],['み','みず','水'],
  ['も','もも','桃子'],['や','やま','山'],['ゆ','ゆき','雪'],['よ','よる','晚上']
].map(([k, ex, zh]) => ({ kana: k, zh: '例：' + ex + '（' + zh + '）' }));

const STAGE2_WORDS = [
  ['ねこ','貓'],['いぬ','狗'],['そら','天空'],['うみ','海'],['やま','山'],['はな','花'],['あめ','雨'],
  ['ほし','星星'],['みず','水'],['くつ','鞋子'],['かさ','傘'],['さかな','魚'],['とり','鳥'],['くるま','車子'],
  ['いえ','家'],['あさ','早上'],['よる','晚上'],['ひと','人'],['すし','壽司'],['きのこ','香菇'],['つき','月亮'],
  ['ゆき','雪'],['もも','桃子'],['あし','腳'],['みみ','耳朵'],['はし','筷子'],['いす','椅子'],['ふね','船']
].map(([k, zh]) => ({ kana: k, zh: zh }));

const STAGES = [
  { name: 'STAGE 1', sub: '單一假名', words: STAGE1_WORDS, count: 12, approach: 8.5, spawnEvery: 2.6, maxAlive: 3, warn: 2.2 },
  { name: 'STAGE 2', sub: '簡單單字', words: STAGE2_WORDS, count: 14, approach: 9.5, spawnEvery: 2.9, maxAlive: 3, warn: 2.0 }
];

/* ---------- 羅馬拼音判定 ---------- */
const KANA = {
  'あ':['a'],'い':['i','yi'],'う':['u','wu'],'え':['e'],'お':['o'],
  'か':['ka','ca'],'き':['ki'],'く':['ku','cu','qu'],'け':['ke'],'こ':['ko','co'],
  'さ':['sa'],'し':['shi','si','ci'],'す':['su'],'せ':['se','ce'],'そ':['so'],
  'た':['ta'],'ち':['chi','ti'],'つ':['tsu','tu'],'て':['te'],'と':['to'],
  'な':['na'],'に':['ni'],'ぬ':['nu'],'ね':['ne'],'の':['no'],
  'は':['ha'],'ひ':['hi'],'ふ':['fu','hu'],'へ':['he'],'ほ':['ho'],
  'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
  'や':['ya'],'ゆ':['yu'],'よ':['yo'],
  'ら':['ra','la'],'り':['ri','li'],'る':['ru','lu'],'れ':['re','le'],'ろ':['ro','lo'],
  'わ':['wa'],'を':['wo'],'ん':['nn',"n'",'xn'],
  'が':['ga'],'ぎ':['gi'],'ぐ':['gu'],'げ':['ge'],'ご':['go'],
  'ざ':['za'],'じ':['ji','zi'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],
  'だ':['da'],'ぢ':['di'],'づ':['du'],'で':['de'],'ど':['do'],
  'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
  'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],
  'ぁ':['xa','la'],'ぃ':['xi','li'],'ぅ':['xu','lu'],'ぇ':['xe','le'],'ぉ':['xo','lo'],
  'ゃ':['xya','lya'],'ゅ':['xyu','lyu'],'ょ':['xyo','lyo'],'っ':['xtu','ltu','xtsu','ltsu'],
  'ー':['-']
};
const YOON = {};
(function () {
  const base = { 'き':'k','ぎ':'g','に':'n','ひ':'h','び':'b','ぴ':'p','み':'m','り':'r' };
  const small = { 'ゃ':'a','ゅ':'u','ょ':'o' };
  for (const b in base) for (const s in small) YOON[b + s] = [base[b] + 'y' + small[s]];
  Object.assign(YOON, {
    'しゃ':['sha','sya'],'しゅ':['shu','syu'],'しょ':['sho','syo'],
    'ちゃ':['cha','cya','tya'],'ちゅ':['chu','cyu','tyu'],'ちょ':['cho','cyo','tyo'],
    'じゃ':['ja','jya','zya'],'じゅ':['ju','jyu','zyu'],'じょ':['jo','jyo','zyo']
  });
})();

function tokenize(word) {
  const units = [];
  for (let i = 0; i < word.length; i++) {
    const two = word.substr(i, 2);
    if (YOON[two]) {
      const combos = [];
      for (const a of KANA[two[0]]) for (const b of KANA[two[1]]) combos.push(a + b);
      units.push({ k: two, opts: YOON[two].concat(combos) });
      i++;
    } else {
      units.push({ k: word[i], opts: (KANA[word[i]] || [word[i]]).slice() });
    }
  }
  return units;
}
// 這個位置可以用的拼法（含促音重複子音、ん 單打 n）
function unitOpts(units, i) {
  const u = units[i];
  const res = u.opts.map(s => ({ s: s, n: 1 }));
  if (u.k === 'っ' && i + 1 < units.length) {
    const dbl = [];
    for (const o of unitOpts(units, i + 1)) {
      const c = o.s[0];
      if ('aiueon-'.indexOf(c) < 0) dbl.push({ s: c + o.s, n: 1 + o.n });
    }
    return dbl.concat(res);
  }
  // ん：後面不是母音或 y 開頭時，單打 n 也可以（對初學者寬鬆）
  if (u.k === 'ん') {
    const nx = units[i + 1];
    if (!nx || nx.opts.every(s => 'aiueoy'.indexOf(s[0]) < 0)) res.push({ s: 'n', n: 1 });
  }
  return res;
}
// 0 = 打錯, 1 = 打對但還沒完成, 2 = 完成
function check(units, i, T) {
  if (i >= units.length) return T === '' ? 2 : 0;
  if (T === '') return 1;
  let best = 0;
  for (const o of unitOpts(units, i)) {
    if (T.startsWith(o.s)) { const r = check(units, i + o.n, T.slice(o.s.length)); if (r > best) best = r; if (best === 2) return 2; }
    else if (o.s.startsWith(T)) best = Math.max(best, 1);
  }
  return best;
}
// 還要打哪些字母（提示用）
function completion(units, i, T) {
  if (i >= units.length) return T === '' ? '' : null;
  const opts = unitOpts(units, i);
  for (const o of opts) if (T.length && T.startsWith(o.s)) { const r = completion(units, i + o.n, T.slice(o.s.length)); if (r !== null) return r; }
  for (const o of opts) if (o.s.startsWith(T)) { const r = completion(units, i + o.n, ''); if (r !== null) return o.s.slice(T.length) + r; }
  return null;
}
// 已經打完幾個假名（上色用）
function consumedKana(units, i, T) {
  if (T === '') return units.slice(0, i).reduce((a, u) => a + u.k.length, 0);
  for (const o of unitOpts(units, i)) if (T.startsWith(o.s)) { const r = consumedKana(units, i + o.n, T.slice(o.s.length)); if (r >= 0) return r; }
  for (const o of unitOpts(units, i)) if (o.s.startsWith(T)) return units.slice(0, i).reduce((a, u) => a + u.k.length, 0);
  return -1;
}

/* ---------- 像素圖 ---------- */
const PAL = {
  o:'#4a3352', k:'#2a1f33', w:'#ffffff', s:'#ffb3c6', p:'#ff8fa8',
  r:'#ff6b7a', R:'#d94a62', y:'#e9a85a', Y:'#b97a3a',
  l:'#ffe08a', L:'#f2b84b', t:'#8a5a44', m:'#e8505b',
  h:'#ff5a7a', H:'#ffd1dc', g:'#b9aec4', G:'#8f84a0',
  f:'#fff3d6', F:'#e8505b'
};
const SPR = {
  kasa: [
    '......oooo......',
    '.....orrrro.....',
    '....orrrrrro....',
    '...orrwwwwrro...',
    '..orrwwkkwwrro..',
    '..orrwwkkwwrro..',
    '.orrrrwwwwrrrro.',
    '.orsrrrrrrrrsro.',
    'orrrrrrokorrrrro',
    'orrrrrrpprrrrrro',
    'oRRRRRRppRRRRRRo',
    '.oo.oo.pp.oo.oo.',
    '.......pp.......',
    '........yo......',
    '........yo......',
    '........yo......',
    '.......oyyo.....',
    '......okkkko....'
  ],
  lamp: [
    '....oooooo....',
    '....otttto....',
    '..oooooooooo..',
    '.ollllllllllo.',
    '.oLLLLLLLLLLo.',
    'ollkkllllkkllo',
    'ollkwllllkwllo',
    'oLLLLLLLLLLLLo',
    'olsllllllllslo',
    'olllllmmlllllo',
    'oLLLLmppmLLLLo',
    '.olllmmmmlllo.',
    '.oLLLLLLLLLLo.',
    '..oooooooooo..',
    '....otttto....',
    '....oooooo....'
  ],
  heart: [
    '.hh.hh.',
    'hHhhhhh',
    'hhhhhhh',
    '.hhhhh.',
    '..hhh..',
    '...h...'
  ],
  heartOff: [
    '.gg.gg.',
    'gGggggg',
    'ggggggg',
    '.ggggg.',
    '..ggg..',
    '...g...'
  ],
  ofuda: [
    'oooooo',
    'offffo',
    'ofFFfo',
    'offFfo',
    'ofFFfo',
    'offffo',
    'offFfo',
    'offffo',
    'oooooo'
  ],
  cloud: [
    '.....wwww.......',
    '...wwwwwwww.www.',
    '.wwwwwwwwwwwwwww',
    'wwwwwwwwwwwwwwww',
    '.wwwwwwwwwwwwww.'
  ]
};
function makeSprite(rows, white) {
  const w = Math.max.apply(null, rows.map(r => r.length)), h = rows.length;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d');
  rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const ch = row[i]; if (ch === '.' || !PAL[ch]) continue; x.fillStyle = white ? '#ffffff' : PAL[ch]; x.fillRect(i, j, 1, 1); } });
  const colors = [];
  rows.forEach(row => { for (const ch of row) if (PAL[ch] && ch !== 'o' && ch !== 'k' && colors.indexOf(PAL[ch]) < 0) colors.push(PAL[ch]); });
  return { cv: cv, w: w, h: h, colors: colors };
}
const IMG = {}, IMGW = {};
for (const k in SPR) { IMG[k] = makeSprite(SPR[k]); IMGW[k] = makeSprite(SPR[k], true); }
const ENEMY_TYPES = [
  { key: 'kasa', name: '唐傘小妖', bob: 'hop' },
  { key: 'lamp', name: '提燈鬼', bob: 'float' }
];

/* ---------- 畫布 ---------- */
const W = 960, H = 540, LW = 320, LH = 180, SC = 3, HORIZON = 72;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH;
const lx = lo.getContext('2d');
ctx.imageSmoothingEnabled = false; lx.imageSmoothingEnabled = false;
const FONT = "'DotGothic16', monospace";
const isTouch = matchMedia('(pointer: coarse)').matches;

/* ---------- 遊戲狀態 ---------- */
let state = 'title', stateT = 0, time = 0, paused = false;
let G = null;
const particles = [], floats = [], shots = [];
let shake = 0, shakeMag = 0, hurtT = 0, imeWarnT = 0, missFlash = 0, ofudaKick = 0;
const petals = Array.from({ length: 18 }, () => ({ x: Math.random() * LW, y: Math.random() * LH, v: 6 + Math.random() * 8, ph: Math.random() * 6 }));
const clouds = [{ x: 30, y: 14, v: 3 }, { x: 190, y: 26, v: 2 }, { x: 260, y: 8, v: 4 }];

function newGame() {
  G = { stage: 0, hearts: 3, score: 0, combo: 0, maxCombo: 0, correct: 0, total: 0, kana: 0, kills: 0, playTime: 0, cleared: false, enemies: [], target: null, queue: [], spawned: 0, spawnT: 0 };
  startStage(0);
}
function startStage(n) {
  G.stage = n;
  const st = STAGES[n];
  G.queue = shuffle(st.words.slice()).slice(0, st.count);
  G.spawned = 0; G.spawnT = 0.6; G.enemies = []; G.target = null;
  setState('intro');
}
function setState(s) { state = s; stateT = 0; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function spawnEnemy() {
  const st = STAGES[G.stage];
  const alive = G.enemies.filter(e => e.state !== 'dead');
  // 避免同時出現開頭字母一樣的單字，選字才不會混淆
  const usedFirst = alive.map(e => completion(e.units, 0, e.typed)[0]);
  let idx = G.queue.findIndex(w => usedFirst.indexOf(completion(tokenize(w.kana), 0, '')[0]) < 0);
  if (idx < 0) idx = 0;
  const w = G.queue.splice(idx, 1)[0];
  const lanes = [-1, -0.5, 0, 0.5, 1].filter(l => !alive.some(e => Math.abs(e.lane - l) < 0.3 && e.t < 0.75));
  const lane = lanes.length ? lanes[Math.floor(Math.random() * lanes.length)] : (Math.random() * 2 - 1);
  const type = ENEMY_TYPES[Math.floor(Math.random() * ENEMY_TYPES.length)];
  G.enemies.push({ word: w, units: tokenize(w.kana), typed: '', lane: lane, t: 0, type: type, state: 'walk', warnT: 0, atkT: 0, flash: 0, miss: 0, kick: 0, dieT: 0, ph: Math.random() * 6, approach: st.approach * (0.9 + Math.random() * 0.2) });
  G.spawned++;
}

/* ---------- 位置計算 ---------- */
function enemyScale(e) { return e.t < 0.34 ? 1 : e.t < 0.68 ? 2 : 3; }
function enemyPos(e) {
  const t = Math.max(0, e.t - e.kick);
  const x = 160 + e.lane * (14 + 96 * t);
  const y = HORIZON + 4 + 98 * t;
  return { x: x, y: y };
}

/* ---------- 輸入 ---------- */
const kb = document.getElementById('kb');
function focusKb() { try { kb.focus({ preventScroll: true }); } catch (e) { kb.focus(); } }
document.getElementById('wrap').addEventListener('pointerdown', ev => {
  focusKb();
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) / r.width * W, y = (ev.clientY - r.top) / r.height * H;
  onClick(x, y);
});
kb.addEventListener('input', ev => {
  if (ev.isComposing || ev.inputType === 'insertCompositionText') { imeWarnT = 3; return; }
  const d = kb.value; kb.value = '';
  for (const ch of d) handleChar(ch);
});
kb.addEventListener('compositionend', () => { kb.value = ''; imeWarnT = 3; });
window.addEventListener('keydown', ev => {
  if (ev.key === 'Process' || ev.isComposing || ev.keyCode === 229) { imeWarnT = 3; return; }
  if (document.activeElement !== kb) {
    focusKb();
    if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey) { ev.preventDefault(); handleChar(ev.key); return; }
  }
  if (ev.key === 'Enter') { ev.preventDefault(); onEnter(); }
  if (ev.key === 'Escape' && state === 'play') { paused = !paused; }
});
window.addEventListener('blur', () => { if (state === 'play') paused = true; });

let buttons = [];
function onClick(x, y) {
  if (paused) { paused = false; return; }
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
  if (state === 'title') { newGame(); }
}
function onEnter() {
  if (paused) { paused = false; return; }
  if (state === 'title') newGame();
  else if (state === 'result' && stateT > 0.8) newGame();
}

function handleChar(raw) {
  if (state !== 'play' || paused) { if (raw === '\n') onEnter(); return; }
  let ch = raw.toLowerCase();
  // 全形英數轉半形
  const code = ch.charCodeAt(0);
  if (code >= 0xFF01 && code <= 0xFF5E) ch = String.fromCharCode(code - 0xFEE0).toLowerCase();
  if (/[぀-ヿ]/.test(ch)) { imeWarnT = 3; return; }
  if (!/^[a-z\-']$/.test(ch)) return;
  G.total++;
  let tg = G.target;
  if (tg && (tg.state === 'dead' || tg.state === 'dying')) tg = G.target = null;
  if (!tg) {
    const cands = G.enemies.filter(e => (e.state === 'walk' || e.state === 'warn') && check(e.units, 0, ch) >= 1);
    if (!cands.length) { onMiss(null); return; }
    cands.sort((a, b) => b.t - a.t);
    tg = G.target = cands[0];
  }
  const T = tg.typed + ch;
  const r = check(tg.units, 0, T);
  if (r === 0) { onMiss(tg); return; }
  tg.typed = T;
  G.correct++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
  tg.flash = 0.07; tg.kick = Math.min(0.06, tg.kick + 0.012);
  const p = enemyPos(tg), s = enemyScale(tg), img = IMG[tg.type.key];
  shots.push({ x0: 160, y0: 166, x1: p.x, y1: p.y - img.h * s / 2, t: 0 });
  ofudaKick = 0.12;
  if (r === 2) killEnemy(tg);
}
function onMiss(tg) {
  G.combo = 0; missFlash = 0.25;
  if (tg) tg.miss = 0.3;
}
function killEnemy(e) {
  const st = STAGES[G.stage];
  const kanaLen = e.word.kana.length;
  const base = 60 * kanaLen;
  const speed = e.state === 'warn' ? 0 : Math.round(120 * (1 - e.t));
  const mult = 1 + Math.min(G.combo, 50) / 50;
  const pts = Math.round((base + speed) * mult);
  G.score += pts; G.kills++; G.kana += kanaLen;
  e.state = 'dying'; e.dieT = 0; G.target = null;
  const p = enemyPos(e), s = enemyScale(e), img = IMG[e.type.key];
  const cy = p.y - img.h * s / 2;
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * Math.PI * 2, v = 30 + Math.random() * 70;
    particles.push({ x: p.x, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, g: 120, life: 0.6 + Math.random() * 0.4, max: 1, c: img.colors[i % img.colors.length], s: 1 + (Math.random() < 0.4 ? 1 : 0) });
  }
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2;
    particles.push({ x: p.x, y: cy, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90, g: 0, life: 0.35, max: 0.35, c: '#fff3a0', s: 2 });
  }
  floats.push({ x: p.x * SC, y: cy * SC - 20, text: '+' + pts, c: '#ff5a7a', t: 0, big: G.combo >= 10 });
  shake = 0.08; shakeMag = 2;
  void st;
}
function hurtPlayer(e) {
  G.hearts--; G.combo = 0;
  hurtT = 0.5; shake = 0.35; shakeMag = 7;
  if (G.target === e) G.target = null;
  const p = enemyPos(e);
  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, v = 20 + Math.random() * 40;
    particles.push({ x: p.x, y: p.y - 20, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: -10, life: 0.5, max: 0.5, c: '#e9e3ef', s: 3 });
  }
  floats.push({ x: 480, y: 300, text: 'いたい！', c: '#e8505b', t: 0, big: true });
}

/* ---------- 更新 ---------- */
function update(dt) {
  time += dt; stateT += dt;
  if (imeWarnT > 0) imeWarnT -= dt;
  for (const c of clouds) { c.x += c.v * dt; if (c.x > LW + 20) c.x = -20; }
  for (const p of petals) { p.y += p.v * dt; p.x += Math.sin(time * 1.5 + p.ph) * 6 * dt - 3 * dt; if (p.y > LH) { p.y = -2; p.x = Math.random() * LW; } if (p.x < -2) p.x = LW; }
  if (paused) return;
  if (shake > 0) shake -= dt;
  if (hurtT > 0) hurtT -= dt;
  if (missFlash > 0) missFlash -= dt;
  if (ofudaKick > 0) ofudaKick -= dt;
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 0.98; if (p.life <= 0) particles.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].t += dt; if (floats[i].t > 1) floats.splice(i, 1); }
  for (let i = shots.length - 1; i >= 0; i--) { shots[i].t += dt / 0.11; if (shots[i].t >= 1) { const s = shots[i]; for (let k = 0; k < 4; k++) particles.push({ x: s.x1, y: s.y1, vx: (Math.random() - 0.5) * 60, vy: (Math.random() - 0.5) * 60, g: 0, life: 0.18, max: 0.18, c: '#fff3a0', s: 1 }); shots.splice(i, 1); } }

  if (state === 'intro' && stateT > 1.8) setState('play');
  if (state === 'play') {
    G.playTime += dt;
    const st = STAGES[G.stage];
    for (const e of G.enemies) {
      if (e.flash > 0) e.flash -= dt;
      if (e.miss > 0) e.miss -= dt;
      if (e.kick > 0) e.kick = Math.max(0, e.kick - dt * 0.15);
      if (e.state === 'walk') { e.t += dt / e.approach; if (e.t >= 1) { e.t = 1; e.state = 'warn'; e.warnT = st.warn; } }
      else if (e.state === 'warn') { e.warnT -= dt; if (e.warnT <= 0) { e.state = 'attack'; e.atkT = 0; } }
      else if (e.state === 'attack') { e.atkT += dt; if (e.atkT > 0.28) { hurtPlayer(e); e.state = 'dead'; } }
      else if (e.state === 'dying') { e.dieT += dt; if (e.dieT > 0.12) e.state = 'dead'; }
    }
    G.enemies = G.enemies.filter(e => e.state !== 'dead');
    const aliveN = G.enemies.length;
    G.spawnT -= dt;
    if (G.queue.length && G.spawnT <= 0 && aliveN < st.maxAlive) { spawnEnemy(); G.spawnT = st.spawnEvery; }
    if (aliveN === 0 && G.queue.length && G.spawnT > 0.8) G.spawnT = 0.8;
    if (G.hearts <= 0) { setState('gameover'); }
    else if (!G.queue.length && G.enemies.length === 0) { setState('clear'); }
  }
  if (state === 'clear' && stateT > 2.0) {
    if (G.stage + 1 < STAGES.length) startStage(G.stage + 1);
    else { G.cleared = true; finish(); }
  }
  if (state === 'gameover' && stateT > 1.8) finish();
}
function finish() {
  const mins = Math.max(G.playTime, 1) / 60;
  G.kpm = Math.round(G.kana / mins);
  G.acc = G.total ? Math.round(G.correct / G.total * 100) : 0;
  const g = G.kpm >= 50 && G.acc >= 95 && G.cleared && G.hearts === 3 ? 'S'
    : G.kpm >= 35 && G.acc >= 90 && G.cleared ? 'A'
    : G.kpm >= 20 && G.acc >= 80 ? 'B'
    : G.kpm >= 10 ? 'C' : 'D';
  G.grade = g;
  G.title = { S: '妖怪退治大師', A: '一流陰陽師', B: '見習陰陽師', C: '修行中的小和尚', D: '迷路的旅人' }[g];
  setState('result');
}

/* ---------- 繪圖：像素世界 ---------- */
function drawWorld() {
  // 天空
  const sky = ['#9ad8ff', '#a9ddff', '#b8e2ff', '#c8e6fb', '#dce8f6', '#f0e6ef', '#ffe0ea'];
  const bh = HORIZON / sky.length;
  sky.forEach((c, i) => { lx.fillStyle = c; lx.fillRect(0, Math.floor(i * bh), LW, Math.ceil(bh) + 1); });
  // 太陽
  lx.fillStyle = '#fff3b0'; circle(268, 22, 9); lx.fillStyle = '#ffe680'; circle(268, 22, 7);
  // 雲
  for (const c of clouds) lx.drawImage(IMG.cloud.cv, Math.round(c.x), c.y);
  // 遠山（富士山）
  lx.fillStyle = '#a7b3e6';
  for (let x = 0; x < LW; x++) { const d = Math.abs(x - 160); const h = Math.max(0, 34 - d * 0.38) + Math.max(0, 10 - Math.abs(x - 52) * 0.25) + Math.max(0, 12 - Math.abs(x - 270) * 0.22); if (h > 0) lx.fillRect(x, HORIZON - Math.round(h), 1, Math.round(h)); }
  lx.fillStyle = '#ffffff';
  for (let x = 146; x <= 174; x++) { const d = Math.abs(x - 160); const h = 34 - d * 0.38; const cap = 9 - d * 0.18 + ((x % 4) < 2 ? 1 : 0); if (cap > 0) lx.fillRect(x, HORIZON - Math.round(h), 1, Math.round(cap)); }
  // 草地（往前流動的條紋）
  lx.fillStyle = '#a6e39a'; lx.fillRect(0, HORIZON, LW, LH - HORIZON);
  lx.fillStyle = '#93d488';
  const flow = state === 'play' && !paused ? (time * 0.35) % 1 : (time * 0.08) % 1;
  for (let k = 0; k < 14; k++) {
    const z = (k + flow) / 14;
    const y1 = HORIZON + Math.round((LH - HORIZON) * z * z);
    const y2 = HORIZON + Math.round((LH - HORIZON) * Math.min(1, (z + 0.035) * (z + 0.035)));
    if (k % 2 === 0) lx.fillRect(0, y1, LW, Math.max(1, y2 - y1));
  }
  // 石板路
  for (let y = HORIZON; y < LH; y++) {
    const t = (y - HORIZON) / (LH - HORIZON);
    const half = 6 + t * 70;
    lx.fillStyle = '#efdcb4'; lx.fillRect(Math.round(160 - half), y, Math.round(half * 2), 1);
    lx.fillStyle = '#d8bf8e'; lx.fillRect(Math.round(160 - half), y, 2, 1); lx.fillRect(Math.round(160 + half - 2), y, 2, 1);
  }
  // 鳥居
  lx.fillStyle = '#e8505b';
  lx.fillRect(150, HORIZON - 14, 20, 2); lx.fillRect(152, HORIZON - 11, 16, 1);
  lx.fillRect(153, HORIZON - 12, 2, 12); lx.fillRect(165, HORIZON - 12, 2, 12);
  lx.fillStyle = '#4a3352'; lx.fillRect(149, HORIZON - 15, 22, 1);
  // 櫻花瓣
  lx.fillStyle = '#ffc2d4';
  for (const p of petals) lx.fillRect(Math.round(p.x), Math.round(p.y), 2, 1);
}
function circle(cx, cy, r) { for (let y = -r; y <= r; y++) { const w = Math.round(Math.sqrt(r * r - y * y)); lx.fillRect(cx - w, cy + y, w * 2 + 1, 1); } }

function drawEnemies() {
  if (!G) return;
  const list = G.enemies.slice().sort((a, b) => a.t - b.t);
  for (const e of list) {
    const p = enemyPos(e);
    let s = enemyScale(e);
    if (e.state === 'attack') s = 4;
    const img = (e.flash > 0 || e.state === 'dying') ? IMGW[e.type.key] : IMG[e.type.key];
    let bob = 0;
    if (e.type.bob === 'hop') bob = -Math.abs(Math.sin(time * 7 + e.ph)) * 2 * s;
    else bob = Math.sin(time * 3 + e.ph) * 1.5 * s;
    let sx = 0;
    if (e.state === 'warn') sx = Math.round(Math.sin(time * 60) * 1);
    if (e.miss > 0) sx = Math.round(Math.sin(time * 80) * 2);
    // 影子
    lx.fillStyle = 'rgba(74,51,82,0.18)';
    lx.fillRect(Math.round(p.x - img.w * s * 0.35), Math.round(p.y - s), Math.round(img.w * s * 0.7), s * 2);
    const dw = img.w * s, dh = img.h * s;
    lx.drawImage(img.cv, Math.round(p.x - dw / 2 + sx), Math.round(p.y - dh + bob), dw, dh);
    e._top = p.y - dh + bob; e._x = p.x;
  }
}
function drawShots() {
  for (const s of shots) {
    const t = s.t;
    const x = s.x0 + (s.x1 - s.x0) * t, y = s.y0 + (s.y1 - s.y0) * t;
    lx.fillStyle = 'rgba(255,243,160,0.7)';
    lx.fillRect(Math.round(x - (s.x1 - s.x0) * 0.08), Math.round(y - (s.y1 - s.y0) * 0.08), 2, 2);
    lx.fillStyle = '#fff3d6'; lx.fillRect(Math.round(x) - 1, Math.round(y) - 2, 3, 4);
    lx.fillStyle = '#e8505b'; lx.fillRect(Math.round(x), Math.round(y) - 1, 1, 2);
  }
}
function drawParticles() {
  for (const p of particles) { lx.globalAlpha = Math.max(0, Math.min(1, p.life / (p.max * 0.6))); lx.fillStyle = p.c; lx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
  lx.globalAlpha = 1;
}
function drawHudPixels() {
  if (!G || state === 'title') return;
  for (let i = 0; i < 3; i++) {
    const img = i < G.hearts ? IMG.heart : IMG.heartOff;
    let dy = 0;
    if (hurtT > 0 && i === G.hearts) dy = Math.round(Math.sin(hurtT * 40) * 2);
    lx.drawImage(img.cv, 6 + i * 17, 6 + dy, img.w * 2, img.h * 2);
  }
  // 符咒（玩家的武器）
  const k = ofudaKick > 0 ? 4 : 0;
  const bob = Math.round(Math.sin(time * 2.5) * 1);
  lx.drawImage(IMG.ofuda.cv, 154, 154 + k + bob, 12, 18);
}

/* ---------- 繪圖：文字介面 ---------- */
function txt(s, x, y, size, color, align, weight) {
  ctx.font = (weight || '') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function outlined(s, x, y, size, color, align, stroke, lw) {
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round'; ctx.lineWidth = lw || 6; ctx.strokeStyle = stroke || '#4a3352'; ctx.strokeText(s, x, y);
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function rrect(x, y, w, h, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = lw || 3; ctx.strokeStyle = stroke; ctx.stroke(); }
}
function measure(s, size) { ctx.font = size + 'px ' + FONT; return ctx.measureText(s).width; }

function drawLabels() {
  if (!G) return;
  const st = STAGES[G.stage];
  const list = G.enemies.filter(e => e.state === 'walk' || e.state === 'warn' || e.state === 'attack').sort((a, b) => a.t - b.t);
  for (const e of list) {
    if (e._top === undefined) continue;
    const isT = G.target === e;
    const cx = e._x * SC, by = e._top * SC - 10;
    const kanaSize = e.t < 0.34 ? 26 : 30;
    const done = Math.max(0, consumedKana(e.units, 0, e.typed));
    const kana = e.word.kana;
    const kw = measure(kana, kanaSize);
    const rest = completion(e.units, 0, e.typed) || '';
    const romaW = measure(e.typed + rest, 16);
    const zhW = measure(e.word.zh, 14);
    const bw = Math.max(kw, romaW, zhW) + 28;
    const bh = kanaSize + 64;
    let bx = cx - bw / 2, byy = by - bh;
    bx = Math.max(6, Math.min(W - bw - 6, bx));
    byy = Math.max(70, byy);
    const shakeX = e.miss > 0 ? Math.sin(time * 90) * 4 : 0;
    bx += shakeX;
    rrect(bx, byy, bw, bh, 10, isT ? '#fffdf5' : 'rgba(255,253,245,0.92)', isT ? '#ff5a7a' : '#4a3352', isT ? 4 : 2.5);
    // 指向敵人的小三角
    ctx.beginPath(); ctx.moveTo(cx - 7 + shakeX, byy + bh - 1); ctx.lineTo(cx + 7 + shakeX, byy + bh - 1); ctx.lineTo(cx + shakeX, byy + bh + 9); ctx.closePath();
    ctx.fillStyle = isT ? '#ff5a7a' : '#4a3352'; ctx.fill();
    // 假名（打完的部分變粉紅）
    let x = bx + bw / 2 - kw / 2;
    const ky = byy + kanaSize + 6;
    const a = kana.slice(0, done), b = kana.slice(done);
    txt(a, x, ky, kanaSize, '#ff5a7a'); x += measure(a, kanaSize);
    txt(b, x, ky, kanaSize, '#3b2a4a');
    // 中文
    txt(e.word.zh, bx + bw / 2, ky + 20, 14, '#8a7a98', 'center');
    // 羅馬拼音提示
    let rx = bx + bw / 2 - romaW / 2;
    txt(e.typed, rx, ky + 38, 16, '#ff5a7a'); rx += measure(e.typed, 16);
    txt(rest, rx, ky + 38, 16, '#b3a6c0');
    // 危
    if (e.state === 'warn' || e.state === 'attack') {
      const blink = Math.floor(time * 8) % 2 === 0;
      const wx = bx + bw / 2, wy = byy - 30;
      rrect(wx - 26, wy - 24, 52, 48, 8, blink ? '#e8505b' : '#ff8a8a', '#4a3352', 3);
      txt('危', wx, wy + 13, 34, '#ffffff', 'center');
      const ratio = Math.max(0, e.warnT / st.warn);
      rrect(bx + 10, byy + bh - 11, (bw - 20), 5, 2, '#f3d6dc');
      rrect(bx + 10, byy + bh - 11, (bw - 20) * ratio, 5, 2, '#e8505b');
    }
  }
}
function drawHudText() {
  if (!G || state === 'title' || state === 'result') return;
  outlined('SCORE ' + String(G.score).padStart(6, '0'), W - 20, 40, 26, '#ffffff', 'right', '#4a3352', 6);
  outlined(STAGES[G.stage].name + '　' + STAGES[G.stage].sub, 480, 40, 22, '#ffffff', 'center', '#4a3352', 6);
  const left = G.queue.length + G.enemies.length;
  outlined('剩下 ' + left + ' 隻', 20, 92, 18, '#ffffff', 'left', '#4a3352', 5);
  if (G.combo >= 5) {
    const pulse = 1 + Math.max(0, 0.15 - (time % 0.3)) ;
    outlined(G.combo + ' COMBO!', W - 20, 78, Math.round(22 * pulse), G.combo >= 20 ? '#ffd23f' : '#ff8fb1', 'right', '#4a3352', 6);
  }
}
function drawFloats() {
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, 1 - f.t);
    outlined(f.text, f.x, f.y - f.t * 40, f.big ? 30 : 22, f.c, 'center', '#ffffff', 6);
  }
  ctx.globalAlpha = 1;
}
function drawOverlay() {
  if (hurtT > 0) {
    const a = Math.min(1, hurtT / 0.5) * 0.55;
    const g = ctx.createRadialGradient(480, 270, 160, 480, 270, 560);
    g.addColorStop(0, 'rgba(232,80,91,0)'); g.addColorStop(1, 'rgba(232,80,91,' + a + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (hurtT > 0.42) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, 0, W, H); }
  }
  if (missFlash > 0) { ctx.fillStyle = 'rgba(120,100,140,' + (missFlash * 0.25) + ')'; ctx.fillRect(0, 0, W, H); }
}

function panel(x, y, w, h) {
  rrect(x + 6, y + 8, w, h, 16, 'rgba(74,51,82,0.25)');
  rrect(x, y, w, h, 16, '#fffaf0', '#4a3352', 5);
}
function button(label, x, y, w, h, fn, primary) {
  rrect(x, y + 5, w, h, 12, '#4a3352');
  rrect(x, y, w, h, 12, primary ? '#ff6b7a' : '#ffffff', '#4a3352', 4);
  txt(label, x + w / 2, y + h / 2 + 9, 24, primary ? '#ffffff' : '#4a3352', 'center');
  buttons.push({ x: x, y: y, w: w, h: h, fn: fn });
}

function drawScreens() {
  buttons = [];
  if (state === 'title') {
    ctx.fillStyle = 'rgba(255,250,240,0.35)'; ctx.fillRect(0, 0, W, H);
    const bob = Math.sin(time * 2) * 6;
    outlined('記事簿妖怪退治', 480, 150 + bob, 72, '#ff6b7a', 'center', '#4a3352', 12);
    outlined('〜 日文打字大作戰・試玩版 〜', 480, 200, 26, '#ffffff', 'center', '#4a3352', 7);
    panel(220, 236, 520, 196);
    txt('看到平假名，就用鍵盤打出羅馬拼音！', 480, 282, 22, '#3b2a4a', 'center');
    txt('例：ねこ → n e k o', 480, 318, 24, '#ff5a7a', 'center');
    txt('妖怪頭上出現「危」就快打完，不然會被攻擊', 480, 354, 18, '#6b5a7a', 'center');
    txt('請先把輸入法切換成「英文」再開始', 480, 384, 18, '#6b5a7a', 'center');
    txt(isTouch ? '建議用電腦鍵盤遊玩；手機請點畫面叫出鍵盤' : '按 Esc 可以暫停', 480, 412, 16, '#9a8aa8', 'center');
    const blink = Math.floor(time * 2) % 2 === 0;
    if (blink) outlined(isTouch ? '點畫面開始' : '按 Enter 或點畫面開始', 480, 486, 30, '#ffffff', 'center', '#4a3352', 8);
  }
  if (state === 'intro') {
    const k = Math.min(1, stateT / 0.3);
    outlined(STAGES[G.stage].name, 480, 250, Math.round(80 * k), '#ffffff', 'center', '#4a3352', 12);
    outlined(STAGES[G.stage].sub, 480, 310, 34, '#ffd23f', 'center', '#4a3352', 8);
  }
  if (state === 'clear') outlined('STAGE CLEAR!', 480, 270, 72, '#ffd23f', 'center', '#4a3352', 12);
  if (state === 'gameover') outlined('GAME OVER', 480, 270, 76, '#ff6b7a', 'center', '#4a3352', 12);
  if (state === 'result') drawResult();
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(74,51,82,0.55)'; ctx.fillRect(0, 0, W, H);
    outlined('暫停中', 480, 250, 60, '#ffffff', 'center', '#4a3352', 10);
    outlined(isTouch ? '點畫面繼續' : '點畫面或按 Esc 繼續', 480, 310, 26, '#ffffff', 'center', '#4a3352', 7);
  }
  if (imeWarnT > 0) {
    rrect(200, 470, 560, 52, 12, '#fff3b0', '#4a3352', 3);
    txt('偵測到中文／日文輸入法，請切換成「英文」輸入', 480, 504, 20, '#b8344a', 'center');
  }
}
function drawResult() {
  ctx.fillStyle = 'rgba(74,51,82,0.35)'; ctx.fillRect(0, 0, W, H);
  panel(150, 40, 660, 460);
  outlined(G.cleared ? '試玩版通關！' : '再接再厲！', 480, 96, 40, '#ff6b7a', 'center', '#4a3352', 9);
  // 評等
  const k = Math.min(1, stateT / 0.4);
  const gc = { S: '#ffd23f', A: '#ff6b7a', B: '#6bb8ff', C: '#8fd18a', D: '#b3a6c0' }[G.grade];
  rrect(196, 128, 170, 170, 20, '#ffffff', '#4a3352', 4);
  outlined(G.grade, 281, 262, Math.round(140 * (0.6 + 0.4 * k)), gc, 'center', '#4a3352', 12);
  txt('評等', 281, 322, 18, '#8a7a98', 'center');
  txt(G.title, 281, 352, 22, '#3b2a4a', 'center');
  const rows = [
    ['打字速度', G.kpm + ' 字／分鐘'],
    ['正確率', G.acc + ' %'],
    ['最大連擊', G.maxCombo + ' COMBO'],
    ['擊倒妖怪', G.kills + ' 隻'],
    ['總分', String(G.score)]
  ];
  rows.forEach((r, i) => {
    const y = 162 + i * 44;
    txt(r[0], 400, y, 22, '#8a7a98');
    txt(r[1], 770, y, i === 4 ? 30 : 24, i === 4 ? '#ff5a7a' : '#3b2a4a', 'right');
    ctx.fillStyle = '#efe4d6'; ctx.fillRect(400, y + 14, 370, 2);
  });
  txt('打字速度＝每分鐘正確打出的假名數', 585, 388, 14, '#a99bb6', 'center');
  txt('排行榜將在完整版開放', 480, 412, 16, '#a99bb6', 'center');
  button('再玩一次', 230, 428, 230, 56, newGame, true);
  button('回記事簿', 500, 428, 230, 56, () => { location.href = '../'; });
}

/* ---------- 主迴圈 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  lx.setTransform(1, 0, 0, 1, 0, 0);
  drawWorld();
  drawEnemies();
  drawShots();
  drawParticles();
  drawHudPixels();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  let ox = 0, oy = 0;
  if (shake > 0) { ox = (Math.random() * 2 - 1) * shakeMag * SC; oy = (Math.random() * 2 - 1) * shakeMag * SC; }
  ctx.setTransform(1, 0, 0, 1, ox, oy);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(lo, 0, 0, W, H);
  drawLabels();
  drawFloats();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawOverlay();
  drawHudText();
  drawScreens();
  requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? document.fonts.load("20px 'DotGothic16'") : Promise.resolve()).catch(() => {}).then(() => {
  focusKb();
  requestAnimationFrame(frame);
});
// 測試用
window.__game = { get state() { return state; }, get G() { return G; }, check: check, tokenize: tokenize, completion: completion };
</script>
