/* ---------- 羅馬拼音判定 ---------- */
const KANA = {
  'あ':['a'],'い':['i','yi'],'う':['u','wu'],'え':['e'],'お':['o'],
  'か':['ka','ca'],'き':['ki'],'く':['ku','cu','qu'],'け':['ke'],'こ':['ko','co'],

  'は':['ha'],'ひ':['hi'],'ふ':['fu','hu'],'へ':['he'],'ほ':['ho'],
  'ま':['ma'],'み':['mi'],'む':['mu'],'め':['me'],'も':['mo'],
  'や':['ya'],'ゆ':['yu'],'よ':['yo'],
  'ら':['ra','la'],'り':['ri','li'],'る':['ru','lu'],'れ':['re','le'],'ろ':['ro','lo'],
  'わ':['wa'],'を':['wo'],'ん':['nn',"n'",'xn'],

  'ざ':['za'],'じ':['ji','zi'],'ず':['zu'],'ぜ':['ze'],'ぞ':['zo'],
  'だ':['da'],'ぢ':['di'],'づ':['du'],'で':['de'],'ど':['do'],
  'ば':['ba'],'び':['bi'],'ぶ':['bu'],'べ':['be'],'ぼ':['bo'],
  'ぱ':['pa'],'ぴ':['pi'],'ぷ':['pu'],'ぺ':['pe'],'ぽ':['po'],
  'ぁ':['xa','la'],'ぃ':['xi','li'],'ぅ':['xu','lu'],'ぇ':['xe','le'],'ぉ':['xo','lo'],
  'ゃ':['xya','lya'],'ゅ':['xyu','lyu'],'ょ':['xyo','lyo'],'っ':['xtu','ltu','xtsu','ltsu'],
  'ー':['-']
};
const YOON = {};
(function () {
  const base = { 'き':'k','ぎ':'g','に':'n','ひ':'h','び':'b','ぴ':'p','み':'m','り':'r' };
  const small = { 'ゃ':'a','ゅ':'u','ょ':'o' };
  for (const b in base) for (const s in small) YOON[b + s] = [base[b] + 'y' + small[s]];
  Object.assign(YOON, {
    'しゃ':['sha','sya'],'しゅ':['shu','syu'],'しょ':['sho','syo'],
    'ちゃ':['cha','cya','tya'],'ちゅ':['chu','cyu','tyu'],'ちょ':['cho','cyo','tyo'],
    'じゃ':['ja','jya','zya'],'じゅ':['ju','jyu','zyu'],'じょ':['jo','jyo','zyo']
  });
})();
function tokenize(word) {
  const units = [];
  for (let i = 0; i < word.length; i++) {
    const two = word.substr(i, 2);
    if (YOON[two]) {
      const combos = [];
      for (const a of KANA[two[0]]) for (const b of KANA[two[1]]) combos.push(a + b);
      units.push({ k: two, opts: YOON[two].concat(combos) });
      i++;
    } else {
      units.push({ k: word[i], opts: (KANA[word[i]] || [word[i]]).slice() });
    }
  }
  return units;
}
function unitOpts(units, i) {
  const u = units[i];
  const res = u.opts.map(s => ({ s: s, n: 1 }));
  if (u.k === 'っ' && i + 1 < units.length) {
    const dbl = [];
    for (const o of unitOpts(units, i + 1)) {
      const c = o.s[0];
      if ('aiueon-'.indexOf(c) < 0) dbl.push({ s: c + o.s, n: 1 + o.n });
    }
    return dbl.concat(res);
  }
  // ん：後面不是母音或 y 開頭時，單打 n 也可以（對初學者寬鬆）
  if (u.k === 'ん') {
    const nx = units[i + 1];
    if (!nx || nx.opts.every(s => 'aiueoy'.indexOf(s[0]) < 0)) res.push({ s: 'n', n: 1 });
  }
  return res;
}
// 0 = 打錯, 1 = 打對但還沒完成, 2 = 完成
function check(units, i, T) {
  if (i >= units.length) return T === '' ? 2 : 0;
  if (T === '') return 1;
  let best = 0;
  for (const o of unitOpts(units, i)) {
    if (T.startsWith(o.s)) { const r = check(units, i + o.n, T.slice(o.s.length)); if (r > best) best = r; if (best === 2) return 2; }
    else if (o.s.startsWith(T)) best = Math.max(best, 1);
  }
  return best;
}
function completion(units, i, T) {
  if (i >= units.length) return T === '' ? '' : null;
  const opts = unitOpts(units, i);
  for (const o of opts) if (T.length && T.startsWith(o.s)) { const r = completion(units, i + o.n, T.slice(o.s.length)); if (r !== null) return r; }
  for (const o of opts) if (o.s.startsWith(T)) { const r = completion(units, i + o.n, ''); if (r !== null) return o.s.slice(T.length) + r; }
  return null;
}

  const upto = n => units.slice(0, n).reduce((a, u) => a + u.k.length, 0);
  if (T === '') return upto(i);
  for (const o of unitOpts(units, i)) if (T.startsWith(o.s)) { const r = consumedKana(units, i + o.n, T.slice(o.s.length)); if (r >= 0) return r; }
  for (const o of unitOpts(units, i)) if (o.s.startsWith(T)) return upto(i);
  return -1;
}

/* ---------- 像素圖 ---------- */
const PAL = {

function finalize(cv) {
  const w = cv.width, h = cv.height, x = cv.getContext('2d');
  const d = x.getImageData(0, 0, w, h).data;
  const colors = [];
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 200) continue;
    const lum = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11;
    if (lum < 90) continue;
    const c = 'rgb(' + d[i] + ',' + d[i + 1] + ',' + d[i + 2] + ')';
    if (colors.indexOf(c) < 0 && colors.length < 8) colors.push(c);
  }
  const wv = document.createElement('canvas'); wv.width = w; wv.height = h;
  const wx = wv.getContext('2d'); wx.drawImage(cv, 0, 0); wx.globalCompositeOperation = 'source-in'; wx.fillStyle = '#ffffff'; wx.fillRect(0, 0, w, h);
  return { cv: cv, white: wv, w: w, h: h, colors: colors };
}
function fromRows(rows) {

  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const x = cv.getContext('2d');
  rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) { const ch = row[i]; if (ch === '.' || !PAL[ch]) continue; x.fillStyle = PAL[ch]; x.fillRect(i, j, 1, 1); } });

// 用簡單形狀畫像素圖，最後自動加上深色外框
function proc(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w + 2; cv.height = h + 2;
  const x = cv.getContext('2d');
  x.translate(1, 1);
  const P = {
    rect(x0, y0, ww, hh, c) { x.fillStyle = c; x.fillRect(x0, y0, ww, hh); },
    px(x0, y0, c) { x.fillStyle = c; x.fillRect(x0, y0, 1, 1); },
    ell(cx, cy, rx, ry, c) {
      x.fillStyle = c;
      for (let yy = Math.ceil(cy - ry); yy <= Math.floor(cy + ry); yy++) {
        const dx = rx * Math.sqrt(Math.max(0, 1 - ((yy - cy) * (yy - cy)) / (ry * ry)));
        const a = Math.round(cx - dx), b = Math.round(cx + dx);
        x.fillRect(a, yy, b - a + 1, 1);
      }
    },
    disc(cx, cy, r, c) { P.ell(cx, cy, r, r, c); },
    horn(cx, y0, hh, c) { for (let k = 0; k < hh; k++) { const hw = Math.floor(k / 2); x.fillStyle = c; x.fillRect(cx - hw, y0 + k, hw * 2 + 1, 1); } }
  };
  draw(P);
  x.setTransform(1, 0, 0, 1, 0, 0);
  const W2 = w + 2, H2 = h + 2;
  const img = x.getImageData(0, 0, W2, H2), d = img.data;
  const solid = (i, j) => i >= 0 && j >= 0 && i < W2 && j < H2 && d[(j * W2 + i) * 4 + 3] > 0;
  const edge = [];
  for (let j = 0; j < H2; j++) for (let i = 0; i < W2; i++) if (!solid(i, j) && (solid(i - 1, j) || solid(i + 1, j) || solid(i, j - 1) || solid(i, j + 1))) edge.push([i, j]);

}
const INK = '#2a1f33', BLUSH = '#ffb3c6';
const IMG = {};

const SND = { on: false, ctx: null, master: null, step: 0 };

function audio() {
  if (!SND.ctx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    SND.ctx = new AC(); SND.master = SND.ctx.createGain(); SND.master.gain.value = 0.16; SND.master.connect(SND.ctx.destination);
  }
  if (SND.ctx.state === 'suspended') SND.ctx.resume();

function tone(freq, dur, type, vol, slide, delay) {

  g.gain.setValueAtTime((vol || 0.5) * 0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(SND.master); o.start(t); o.stop(t + dur + 0.02);
}

  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);

  s.buffer = buf; s.connect(g); g.connect(SND.master); s.start();
}

/* ---------- 畫布 ---------- */
const W = 960, H = 540, LW = 320, LH = 180, SC = 3, HORIZON = 72;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const lo = document.createElement('canvas'); lo.width = LW; lo.height = LH;
const lx = lo.getContext('2d');
ctx.imageSmoothingEnabled = false; lx.imageSmoothingEnabled = false;
const FONT = "'DotGothic16', monospace";

/* ---------- 遊戲狀態 ---------- */
let state = 'title', stateT = 0, time = 0, paused = false;
let G = null;
const particles = [], floats = [], shots = [];
let shake = 0, shakeMag = 0, hurtT = 0, imeWarnT = 0, missFlash = 0, ofudaKick = 0, flashT = 0;
const petals = Array.from({ length: 18 }, () => ({ x: Math.random() * LW, y: Math.random() * LH, v: 6 + Math.random() * 8, ph: Math.random() * 6 }));
const clouds = [{ x: 30, y: 14, v: 3 }, { x: 190, y: 26, v: 2 }, { x: 260, y: 8, v: 4 }];

function newGame() {
  hideNameBox();
  G = { level: 0, hearts: 3, score: 0, combo: 0, maxCombo: 0, correct: 0, total: 0, kana: 0, kills: 0, bosses: 0, playTime: 0, wall: 0, cleared: false, enemies: [], boss: null, target: null, queue: [], spawned: 0, spawnT: 0, submitted: false, askedName: false };
  board.highlight = null;
  startLevel(0);
}
function startLevel(n) {
  G.level = n;
  const L = LEVELS[n];
  G.enemies = []; G.target = null; G.boss = null;
  if (L.type === 'stage') {
    G.queue = shuffle(L.words.slice()).slice(0, L.count);
    G.spawned = 0; G.spawnT = 0.6;
  } else {
    G.queue = shuffle(L.words.slice());
    G.boss = { key: L.boss, hp: L.hp, max: L.hp, t: 1, state: 'charge', timer: L.wordTime, warnT: 0, atkT: 0, flash: 0, miss: 0, kick: 0, dieT: 0, ph: 0, missed: false };
    nextBossWord();
    sfx.boss();
  }
  setState('intro');
}
function nextBossWord() {
  const b = G.boss, L = LEVELS[G.level];
  if (!G.queue.length) G.queue = shuffle(L.words.slice());
  b.word = G.queue.shift(); b.units = tokenize(b.word.kana); b.typed = ''; b.missed = false;
  b.state = 'charge'; b.timer = L.wordTime;
}
function setState(s) { state = s; stateT = 0; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

function spawnEnemy() {
  const L = LEVELS[G.level];
  const alive = G.enemies;
  const usedFirst = alive.map(e => (completion(e.units, 0, e.typed) || ' ')[0]);
  let idx = G.queue.findIndex(w => usedFirst.indexOf(completion(tokenize(w.kana), 0, '')[0]) < 0);
  if (idx < 0) idx = 0;
  const w = G.queue.splice(idx, 1)[0];
  const lanes = [-1, -0.5, 0, 0.5, 1].filter(l => !alive.some(e => Math.abs(e.lane - l) < 0.3 && e.t < 0.75));
  const lane = lanes.length ? lanes[Math.floor(Math.random() * lanes.length)] : (Math.random() * 2 - 1);
  const key = L.enemies[Math.floor(Math.random() * L.enemies.length)];
  G.enemies.push({ word: w, units: tokenize(w.kana), typed: '', lane: lane, t: 0, key: key, state: 'walk', warnT: 0, atkT: 0, flash: 0, miss: 0, kick: 0, dieT: 0, ph: Math.random() * 6, missed: false, approach: L.approach * (0.9 + Math.random() * 0.2) });
  G.spawned++;
}

/* ---------- 位置計算 ---------- */
function enemyScale(e) { return e.t < 0.34 ? 1 : e.t < 0.68 ? 2 : 3; }
function enemyPos(e) {
  const t = Math.max(0, e.t - e.kick);
  return { x: 160 + e.lane * (14 + 96 * t), y: HORIZON + 4 + 98 * t };
}
const BOSS_X = 160, BOSS_Y = 152;

/* ---------- 輸入 ---------- */
const kb = document.getElementById('kb');
const wrap = document.getElementById('wrap');
const nameBox = document.getElementById('nameBox');
function focusKb() { if (!nameBox.hidden) return; try { kb.focus({ preventScroll: true }); } catch (e) { kb.focus(); } }
function inNameBox(ev) { return ev.target && ev.target.closest && ev.target.closest('#nameBox'); }
// 手機：阻止點擊把焦點從輸入框搶走（否則手指放開鍵盤就收起來）
wrap.addEventListener('touchstart', ev => { if (inNameBox(ev)) return; ev.preventDefault(); focusKb(); }, { passive: false });
wrap.addEventListener('touchend', ev => {
  if (inNameBox(ev)) return;
  ev.preventDefault(); focusKb();
  const t = ev.changedTouches[0]; if (t) pointAt(t.clientX, t.clientY);
}, { passive: false });
wrap.addEventListener('mousedown', ev => { if (inNameBox(ev)) return; ev.preventDefault(); focusKb(); pointAt(ev.clientX, ev.clientY); });
function pointAt(cx, cy) {
  const r = cv.getBoundingClientRect();
  onClick((cx - r.left) / r.width * W, (cy - r.top) / r.height * H);
}
kb.addEventListener('blur', () => { if (isTouch && state === 'play') paused = true; });
function fit() {
  const vv = window.visualViewport;
  const vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
  wrap.style.width = Math.floor(Math.min(vw, vh * 16 / 9)) + 'px';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', () => window.scrollTo(0, 0)); }
addEventListener('resize', fit); fit();

kb.addEventListener('input', ev => {
  if (ev.isComposing || ev.inputType === 'insertCompositionText') { imeWarnT = 3; return; }
  const d = kb.value; kb.value = '';
  for (const ch of d) handleChar(ch);
});
kb.addEventListener('compositionend', () => { kb.value = ''; imeWarnT = 3; });
window.addEventListener('keydown', ev => {
  if (!nameBox.hidden) { if (ev.key === 'Escape') skipName(); return; }
  if (ev.key === 'Process' || ev.isComposing || ev.keyCode === 229) { imeWarnT = 3; return; }
  if (document.activeElement !== kb) {
    focusKb();
    if (ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey && !ev.altKey) { ev.preventDefault(); handleChar(ev.key); return; }
  }
  if (ev.key === 'Enter') { ev.preventDefault(); onEnter(); }
  if (ev.key === 'Escape') { if (state === 'play') paused = !paused; else if (state === 'board') closeBoard(); }
});
window.addEventListener('blur', () => { if (state === 'play' && !isTouch) paused = true; });

let buttons = [];
function onClick(x, y) {
  for (const b of buttons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.fn(); return; }
  if (paused) { paused = false; return; }
  if (state === 'title') newGame();
}
function onEnter() {
  if (paused) { paused = false; return; }
  if (state === 'title') newGame();
  else if (state === 'result' && stateT > 0.8) newGame();
  else if (state === 'board') closeBoard();
}

function handleChar(raw) {
  if (state !== 'play' || paused) return;
  let ch = raw.toLowerCase();
  const code = ch.charCodeAt(0);
  if (code >= 0xFF01 && code <= 0xFF5E) ch = String.fromCharCode(code - 0xFEE0).toLowerCase();
  if (/[぀-ヿ]/.test(ch)) { imeWarnT = 3; return; }
  if (!/^[a-z\-']$/.test(ch)) return;
  G.total++;
  // BOSS 戰
  if (G.boss) {
    const b = G.boss;
    if (b.state === 'dying' || b.state === 'dead') return;
    const T = b.typed + ch, r = check(b.units, 0, T);
    if (r === 0) { onMiss(b); return; }
    b.typed = T; onHit(b, BOSS_X, BOSS_Y - IMG[b.key].h * 2 / 2);
    if (r === 2) bossDamage();
    return;
  }
  let tg = G.target;
  if (tg && (tg.state === 'dead' || tg.state === 'dying')) tg = G.target = null;
  if (!tg) {
    const cands = G.enemies.filter(e => (e.state === 'walk' || e.state === 'warn') && check(e.units, 0, ch) >= 1);
    if (!cands.length) { onMiss(null); return; }
    cands.sort((a, b) => b.t - a.t);
    tg = G.target = cands[0];
  }
  const T = tg.typed + ch, r = check(tg.units, 0, T);
  if (r === 0) { onMiss(tg); return; }
  tg.typed = T;
  const p = enemyPos(tg), s = enemyScale(tg);
  tg.kick = Math.min(0.06, tg.kick + 0.012);
  onHit(tg, p.x, p.y - IMG[tg.key].h * s / 2);
  if (r === 2) killEnemy(tg);
}
function onHit(obj, x, y) {
  G.correct++; G.combo++; G.maxCombo = Math.max(G.maxCombo, G.combo);
  obj.flash = 0.07;
  shots.push({ x0: 160, y0: 166, x1: x, y1: y, t: 0 });

function burst(x, y, colors, n, power) {

    particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, g: 120, life: 0.6 + Math.random() * 0.4, max: 1, c: colors[i % colors.length], s: 1 + (Math.random() < 0.4 ? 1 : 0) });
  }
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2;
    particles.push({ x: x, y: y, vx: Math.cos(a) * 90 * (power || 1), vy: Math.sin(a) * 90 * (power || 1), g: 0, life: 0.35, max: 0.35, c: '#fff3a0', s: 2 });
  }
}
function killEnemy(e) {
  const kanaLen = e.word.kana.length;
  const speed = e.state === 'warn' ? 0 : Math.round(120 * (1 - e.t));
  const mult = 1 + Math.min(G.combo, 50) / 50;
  const pts = Math.round((60 * kanaLen + speed) * mult);
  G.score += pts; G.kills++; G.kana += kanaLen;
  e.state = 'dying'; e.dieT = 0; G.target = null;
  const p = enemyPos(e), s = enemyScale(e), img = IMG[e.key];
  const cy = p.y - img.h * s / 2;
  burst(p.x, cy, img.colors, 22, 1);
  floats.push({ x: p.x * SC, y: cy * SC - 20, text: '+' + pts, c: '#ff5a7a', t: 0, big: G.combo >= 10 });
  shake = 0.08; shakeMag = 2; sfx.kill();
}
function bossDamage() {
  const b = G.boss, L = LEVELS[G.level];
  const kanaLen = b.word.kana.length;
  const mult = 1 + Math.min(G.combo, 50) / 50;
  const pts = Math.round((80 * kanaLen + Math.round(Math.max(0, b.timer) / L.wordTime * 150)) * mult);
  G.score += pts; G.kana += kanaLen; b.hp--;
  const img = IMG[b.key];
  burst(BOSS_X, BOSS_Y - img.h, img.colors, 26, 1.3);
  floats.push({ x: BOSS_X * SC + 170, y: (BOSS_Y - img.h) * SC, text: '+' + pts, c: '#ff5a7a', t: 0, big: true });
  shake = 0.2; shakeMag = 4; b.kick = 0.25; sfx.bossHit();
  if (b.hp <= 0) {
    b.state = 'dying'; b.dieT = 0;
    const bonus = 1000 * (G.bosses + 1);
    G.score += bonus; G.bosses++; G.kills++;
    floats.push({ x: 480, y: 250, text: 'BOSS BONUS +' + bonus, c: '#ffd23f', t: -0.4, big: true });
  } else {

  }

function hurtPlayer(x, y) {

  hurtT = 0.5; shake = 0.35; shakeMag = 7; sfx.hurt();

    particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: -10, life: 0.5, max: 0.5, c: '#e9e3ef', s: 3 });
  }

/* ---------- 更新 ---------- */
function update(dt) {
  time += dt; stateT += dt;
  if (imeWarnT > 0) imeWarnT -= dt;
  for (const c of clouds) { c.x += c.v * dt; if (c.x > LW + 20) c.x = -20; }
  for (const p of petals) { p.y += p.v * dt; p.x += Math.sin(time * 1.5 + p.ph) * 6 * dt - 3 * dt; if (p.y > LH) { p.y = -2; p.x = Math.random() * LW; } if (p.x < -2) p.x = LW; }
  if (paused) return;
  if (G && state !== 'result' && state !== 'board') G.wall += dt;
  if (shake > 0) shake -= dt;
  if (hurtT > 0) hurtT -= dt;
  if (missFlash > 0) missFlash -= dt;

    if (f.t < 0) continue;
    ctx.globalAlpha = Math.max(0, 1 - f.t);
    outlined(f.text, f.x, f.y - f.t * 40, f.big ? 30 : 22, f.c, 'center', '#ffffff', 6);
  }
  ctx.globalAlpha = 1;
}
function drawOverlay() {
  if (hurtT > 0) {
    const a = Math.min(1, hurtT / 0.5) * 0.55;
    const g = ctx.createRadialGradient(480, 270, 160, 480, 270, 560);
    g.addColorStop(0, 'rgba(232,80,91,0)'); g.addColorStop(1, 'rgba(232,80,91,' + a + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (hurtT > 0.42) { ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0, 0, W, H); }
  }
  if (flashT > 0) { ctx.fillStyle = 'rgba(255,255,255,' + flashT * 2 + ')'; ctx.fillRect(0, 0, W, H); }
  if (missFlash > 0) { ctx.fillStyle = 'rgba(120,100,140,' + (missFlash * 0.25) + ')'; ctx.fillRect(0, 0, W, H); }
}
function panel(x, y, w, h) {
  rrect(x + 6, y + 8, w, h, 16, 'rgba(74,51,82,0.25)');
  rrect(x, y, w, h, 16, '#fffaf0', '#4a3352', 5);
}
function button(label, x, y, w, h, fn, primary, size) {
  rrect(x, y + 5, w, h, 12, '#4a3352');
  rrect(x, y, w, h, 12, primary ? '#ff6b7a' : '#ffffff', '#4a3352', 4);
  txt(label, x + w / 2, y + h / 2 + (size || 24) * 0.36, size || 24, primary ? '#ffffff' : '#4a3352', 'center');
  buttons.push({ x: x, y: y, w: w, h: h, fn: fn });
}
function soundButton(x, y) {
  button(SND.on ? '♪ 音效：開' : '♪ 音效：關', x, y, 150, 40, toggleSound, false, 18);
}

function drawScreens() {
  buttons = [];
  if (state === 'title') {
    ctx.fillStyle = 'rgba(255,250,240,0.35)'; ctx.fillRect(0, 0, W, H);
    const bob = Math.sin(time * 2) * 6;
    outlined('記事簿妖怪退治', 480, 128 + bob, 72, '#ff6b7a', 'center', '#4a3352', 12);
    outlined('〜 日文打字大作戰 〜', 480, 176, 26, '#ffffff', 'center', '#4a3352', 7);
    panel(220, 206, 520, 196);
    txt('看到平假名，就用鍵盤打出羅馬拼音！', 480, 250, 22, '#3b2a4a', 'center');
    txt('例：ねこ → n e k o', 480, 286, 24, '#ff5a7a', 'center');
    txt('妖怪頭上出現「危」就快打完，不然會被攻擊', 480, 322, 18, '#6b5a7a', 'center');
    txt('全 5 關＋3 隻 BOSS，打倒 BOSS 可以回復愛心', 480, 352, 18, '#6b5a7a', 'center');
    txt(isTouch ? '建議用電腦鍵盤遊玩；手機請點畫面叫出鍵盤' : '請先把輸入法切換成「英文」再開始，按 Esc 可以暫停', 480, 382, 16, '#9a8aa8', 'center');
    const blink = Math.floor(time * 2) % 2 === 0;
    if (blink) outlined(isTouch ? '點畫面開始' : '按 Enter 或點畫面開始', 480, 450, 30, '#ffffff', 'center', '#4a3352', 8);
    button('排行榜', 20, H - 60, 150, 40, () => openBoard('title'), false, 18);
    soundButton(W - 170, H - 60);
  }
  if (state === 'intro') {
    const L = LEVELS[G.level], k = Math.min(1, stateT / 0.3);
    if (L.type === 'boss') {
      ctx.fillStyle = 'rgba(232,80,91,' + (0.25 + 0.15 * Math.sin(time * 10)) + ')'; ctx.fillRect(0, 190, W, 150);
      outlined('BOSS 出現！', 480, 250, Math.round(64 * k), '#ffffff', 'center', '#4a3352', 12);
      outlined(L.sub, 480, 312, 40, '#ffd23f', 'center', '#4a3352', 9);
    } else {
      outlined(L.name, 480, 250, Math.round(80 * k), '#ffffff', 'center', '#4a3352', 12);
      outlined(L.sub, 480, 310, 34, '#ffd23f', 'center', '#4a3352', 8);
      if (L.hint === 'miss') outlined('這關不顯示拼音，打錯才會出現提示', 480, 354, 20, '#ffffff', 'center', '#4a3352', 6);
    }
  }
  if (state === 'clear') {
    const L = LEVELS[G.level];
    outlined(L.type === 'boss' ? 'BOSS 擊退！' : 'STAGE CLEAR!', 480, 270, 72, '#ffd23f', 'center', '#4a3352', 12);
  }
  if (state === 'gameover') outlined('GAME OVER', 480, 270, 76, '#ff6b7a', 'center', '#4a3352', 12);
  if (state === 'play' || state === 'intro') soundButton(W - 170, H - 56);
  if (state === 'result') drawResult();
  if (state === 'board') drawBoard();
  if (paused && state === 'play') {
    ctx.fillStyle = 'rgba(74,51,82,0.55)'; ctx.fillRect(0, 0, W, H);
    outlined('暫停中', 480, 250, 60, '#ffffff', 'center', '#4a3352', 10);
    outlined(isTouch ? '點畫面繼續（會叫出鍵盤）' : '點畫面或按 Esc 繼續', 480, 310, 26, '#ffffff', 'center', '#4a3352', 7);
  }
  if (imeWarnT > 0) {
    rrect(200, 470, 560, 52, 12, '#fff3b0', '#4a3352', 3);
    txt('偵測到中文／日文輸入法，請切換成「英文」輸入', 480, 504, 20, '#b8344a', 'center');
  }
}
function drawResult() {
  ctx.fillStyle = 'rgba(74,51,82,0.35)'; ctx.fillRect(0, 0, W, H);
  panel(130, 30, 700, 480);
  outlined(G.cleared ? '全破！恭喜通關！' : '再接再厲！', 480, 84, 38, '#ff6b7a', 'center', '#4a3352', 9);
  const k = Math.min(1, stateT / 0.4);
  const gc = { S: '#ffd23f', A: '#ff6b7a', B: '#6bb8ff', C: '#8fd18a', D: '#b3a6c0' }[G.grade];
  rrect(170, 112, 170, 170, 20, '#ffffff', '#4a3352', 4);
  outlined(G.grade, 255, 246, Math.round(140 * (0.6 + 0.4 * k)), gc, 'center', '#4a3352', 12);
  txt('評等', 255, 306, 18, '#8a7a98', 'center');
  txt(G.title, 255, 336, 22, '#3b2a4a', 'center');
  const reachedName = G.cleared ? '全部通關' : LEVELS[G.level].name + ' ' + LEVELS[G.level].sub;
  const rows = [
    ['打字速度', G.kpm + ' 字／分鐘'],
    ['正確率', G.acc + ' %'],
    ['最大連擊', G.maxCombo + ' COMBO'],
    ['擊倒妖怪', G.kills + ' 隻（BOSS ' + G.bosses + '）'],
    ['到達關卡', reachedName],
    ['總分', String(G.score)]
  ];
  rows.forEach((r, i) => {
    const y = 136 + i * 40;
    txt(r[0], 380, y, 20, '#8a7a98');
    txt(r[1], 800, y, i === 5 ? 28 : 21, i === 5 ? '#ff5a7a' : '#3b2a4a', 'right');
    ctx.fillStyle = '#efe4d6'; ctx.fillRect(380, y + 12, 420, 2);
  });
  txt('打字速度＝每分鐘正確打出的假名數', 590, 390, 14, '#a99bb6', 'center');
  let note = '';
  if (board.status === 'loading') note = '排行榜讀取中…';
  else if (board.status === 'off') note = '排行榜準備中，敬請期待';
  else if (G.submitted) note = '已登錄排行榜！';
  else if (board.status === 'ok') note = qualifies(G.score) ? '進入前 10 名！可以登錄排行榜' : '這次沒有進入前 10 名，再挑戰一次吧';
  txt(note, 255, 380, 16, '#ff5a7a', 'center');
  button('再玩一次', 160, 418, 200, 56, newGame, true);
  button('排行榜', 380, 418, 200, 56, () => openBoard('result'));
  button('回記事簿', 600, 418, 200, 56, () => { location.href = '../'; });
  // 「可以登錄排行榜」那行字可以點，重新打開留名視窗
  if (board.status === 'ok' && !G.submitted && qualifies(G.score) && nameBox.hidden) buttons.push({ x: 140, y: 362, w: 230, h: 30, fn: showNameBox });
}
function drawBoard() {
  ctx.fillStyle = 'rgba(74,51,82,0.45)'; ctx.fillRect(0, 0, W, H);
  panel(110, 24, 740, 492);
  outlined('排行榜', 480, 76, 40, '#ff6b7a', 'center', '#4a3352', 9);
  const tabs = [['month', '本月'], ['all', '歷代']];
  tabs.forEach((t, i) => {
    const x = 150 + i * 130, on = board.period === t[0];
    rrect(x, 96, 116, 38, 10, on ? '#ff6b7a' : '#ffffff', '#4a3352', 3);
    txt(t[1], x + 58, 122, 20, on ? '#ffffff' : '#4a3352', 'center');
    buttons.push({ x: x, y: 96, w: 116, h: 38, fn: () => { board.period = t[0]; } });
  });
  button('關閉', 690, 92, 120, 42, closeBoard, false, 20);
  if (board.status === 'loading' || board.status === 'idle') { txt('讀取中…', 480, 300, 24, '#8a7a98', 'center'); return; }
  if (board.status === 'off') {
    txt('排行榜準備中，敬請期待！', 480, 280, 26, '#3b2a4a', 'center');
    txt('開放後，進入前 10 名就可以留下名字', 480, 320, 18, '#8a7a98', 'center');
    return;
  }
  const list = board.data[board.period] || [];
  const cols = [[170, '名次', 'left'], [250, '名字', 'left'], [560, '分數', 'right'], [680, '速度', 'right'], [780, '評等', 'right']];
  cols.forEach(c => txt(c[1], c[0], 166, 16, '#8a7a98', c[2]));
  ctx.fillStyle = '#efe4d6'; ctx.fillRect(160, 176, 640, 2);
  if (!list.length) { txt('還沒有人登錄，成為第一名吧！', 480, 300, 22, '#8a7a98', 'center'); return; }
  list.forEach((r, i) => {
    const y = 206 + i * 31;
    const me = board.highlight && r.id === board.highlight;
    if (me) rrect(156, y - 22, 648, 30, 8, '#ffe3ea');
    const medal = ['#ffd23f', '#c9c6d6', '#e3a46a'][i];
    if (medal) { ctx.fillStyle = medal; ctx.beginPath(); ctx.arc(182, y - 7, 12, 0, Math.PI * 2); ctx.fill(); }
    txt(String(i + 1), 182, y, 18, '#3b2a4a', 'center');
    txt(String(r.name).slice(0, 8), 250, y, 20, '#3b2a4a');
    txt(String(r.score), 560, y, 20, me ? '#ff5a7a' : '#3b2a4a', 'right');
    txt(r.kpm + ' 字/分', 680, y, 16, '#6b5a7a', 'right');
    txt(String(r.grade), 780, y, 20, '#3b2a4a', 'right');
  });
}

/* ---------- 主迴圈 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  lx.setTransform(1, 0, 0, 1, 0, 0);
  drawWorld();
  drawBoss();
  drawEnemies();
  drawShots();
  drawParticles();
  drawHudPixels();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  let ox = 0, oy = 0;
  if (shake > 0) { ox = (Math.random() * 2 - 1) * shakeMag * SC; oy = (Math.random() * 2 - 1) * shakeMag * SC; }
  ctx.setTransform(1, 0, 0, 1, ox, oy);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(lo, 0, 0, W, H);
  drawLabels();
  drawFloats();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawOverlay();
  drawHudText();
  drawScreens();
  requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? document.fonts.load("20px 'DotGothic16'") : Promise.resolve()).catch(() => {}).then(() => {
  focusKb();
  requestAnimationFrame(frame);
});
// 測試用
window.__game = { get state() { return state; }, get G() { return G; }, board: board, LEVELS: LEVELS, check: check, tokenize: tokenize, completion: completion, startLevel: n => startLevel(n) };
</script>
