<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凱倫的日語記事簿｜日文課程</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF6EC}
a{color:#B4472F}a:hover{color:#8E3522}
.grid-paper{background-color:#FBF6EC;background-image:linear-gradient(#ECE4D3 1px,transparent 1px),linear-gradient(90deg,#ECE4D3 1px,transparent 1px);background-size:24px 24px}
.ruled{background-color:#FFFDF8;background-image:repeating-linear-gradient(#FFFDF8 0,#FFFDF8 35px,#E6DCC8 35px,#E6DCC8 36px)}
.grid-paper{overflow-x:clip}
@media (max-width: 520px){.ix-hint{bottom:140px!important}}
.photo-ph{background-color:#EFE7D8;background-image:repeating-linear-gradient(45deg,#E4DAC6 0,#E4DAC6 2px,transparent 2px,transparent 12px)}
input,select,textarea,button{font:inherit;color:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #B4472F;outline-offset:2px}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}

.rot{transform:rotate(var(--r,0deg))}
.btn{transition:transform .2s ease,box-shadow .2s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(58,53,48,.18)}
.btn:active{transform:translateY(1px);box-shadow:none}
.icon-btn{transition:background .2s ease,transform .2s ease}
.icon-btn:hover{background:#F3EAD8;transform:scale(1.06)}
.polaroid{transition:transform .45s ease,box-shadow .45s ease}
.polaroid:hover{transform:rotate(0deg) translateY(-8px) scale(1.02)!important;box-shadow:0 22px 40px rgba(58,53,48,.18)!important}
.card{transition:transform .3s ease,box-shadow .3s ease}
.card:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:0 2px 0 #E6DCC8,0 24px 40px rgba(58,53,48,.14)!important}
.card .card-tape{transition:transform .3s ease}
.card:hover .card-tape{transform:rotate(var(--r,0deg)) scaleX(1.15)}
.flip{perspective:900px}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,1.35,.5,1);transform-style:preserve-3d}
.flip:hover .flip-inner{transform:rotateY(14deg)}
.flip .flip-inner.is-flipped{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-back{transform:rotateY(180deg)}
.faq-plus{transition:transform .3s ease}
details[open] .faq-plus{transform:rotate(45deg)}
.opt{transition:background .2s ease,transform .2s ease,border-color .2s ease}
.opt:hover{transform:translateX(6px);background:#F6EEDD}
.petal{position:absolute;top:-24px;opacity:0;pointer-events:none;border-radius:100% 0 100% 0}
.marquee-track{display:flex;width:max-content}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes tapeStick{from{opacity:0;transform:rotate(var(--r,0deg)) scaleX(.2)}to{opacity:1;transform:rotate(var(--r,0deg)) scaleX(1)}}
@keyframes stampPress{0%{opacity:0;transform:rotate(var(--r,0deg)) scale(2.2)}60%{opacity:1;transform:rotate(var(--r,0deg)) scale(.9)}100%{opacity:1;transform:rotate(var(--r,0deg)) scale(1)}}
@keyframes floaty{0%,100%{transform:rotate(var(--r,0deg)) translateY(0)}50%{transform:rotate(calc(var(--r,0deg) + 3deg)) translateY(-10px)}}
@keyframes petalFall{0%{opacity:0;transform:translate(0,0) rotate(0deg)}10%{opacity:.9}85%{opacity:.9}100%{opacity:0;transform:translate(var(--dx,80px),760px) rotate(var(--spin,360deg))}}
@keyframes pageInA{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes pageInB{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes cardInA{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes cardInB{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes revealUp{from{opacity:0;transform:translateY(48px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: no-preference){
.a-up{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
.a-tape{animation:tapeStick .6s ease-out both;transform-origin:left center}
.a-stamp{animation:stampPress .65s cubic-bezier(.3,1.5,.5,1) both}
.a-float{animation:floaty 5s ease-in-out infinite}
.petal{animation-name:petalFall;animation-timing-function:linear;animation-iteration-count:infinite}
.pageA{animation:pageInA .5s ease both}
.pageB{animation:pageInB .5s ease both}
.cardA{animation:cardInA .5s ease backwards}
.cardB{animation:cardInB .5s ease backwards}
.marquee-track{animation:marquee 32s linear infinite}
details[open] .faq-a{animation:fadeUp .35s ease both}
}
/* ===== 開場：四季互動（Intro.dc.html 使用的樣式） ===== */
.is-intro .a-up,.is-intro .a-tape,.is-intro .a-stamp{animation:none!important;opacity:0}
.ix-root{animation:ixIn .5s ease both}
.ix-leave{animation:ixLeave .85s cubic-bezier(.7,0,.3,1) forwards}
.ix-scene{animation:ixFade .8s ease both}
.ix-t0{animation:ixRise .7s ease both}
.ix-t1{animation:ixRise2 .7s ease both}
.ix-h0{animation:ixHint .5s ease both,ixBob 2.4s ease-in-out .5s infinite}
.ix-h1{animation:ixHint2 .5s ease both,ixBob 2.4s ease-in-out .5s infinite}
.ix-ripple{animation:ixRipple 1.6s ease-out infinite}
.ix-btn{transition:transform .2s ease,box-shadow .2s ease}
.ix-btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.15)}
.ix-p{position:absolute;top:0;animation:ixFall linear infinite}
.ix-amb-fw{position:absolute;width:0;height:0;animation:ixBurst 3.2s ease-out infinite}
.ix-amb-ray{position:absolute;left:-1px;bottom:0;width:3px;height:44px;border-radius:3px;transform-origin:50% 100%;transform:rotate(var(--a)) translateY(-20px)}
.ix-stamp{animation:stampPress .65s cubic-bezier(.3,1.5,.5,1) .2s both}
.ix-off{display:none}
.ix-bloom.ix-a{animation:ixBloom 1.9s ease-out forwards}
.ix-bloom.ix-b{animation:ixBloom2 1.9s ease-out forwards}
.ix-fw.ix-a{animation:ixFwFade 1.5s linear forwards}
.ix-fw.ix-b{animation:ixFwFade2 1.5s linear forwards}
.ix-ray{position:absolute;left:0;top:0;width:3px;margin-left:-1.5px;border-radius:3px;transform-origin:50% 0;opacity:0}
.ix-ray.ix-a{animation:ixRay 1.2s cubic-bezier(.1,.8,.3,1) forwards}
.ix-ray.ix-b{animation:ixRay2 1.2s cubic-bezier(.1,.8,.3,1) forwards}
.ix-core{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;opacity:0}
.ix-core.ix-a{animation:ixCore .5s ease-out forwards}
.ix-core.ix-b{animation:ixCore2 .5s ease-out forwards}
.ix-leaf.ix-a{animation:ixLeaf 1.3s cubic-bezier(.2,.7,.3,1) forwards}
.ix-leaf.ix-b{animation:ixLeaf2 1.3s cubic-bezier(.2,.7,.3,1) forwards}
.ix-spark.ix-a{animation:ixSpark .95s ease-out forwards}
.ix-spark.ix-b{animation:ixSpark2 .95s ease-out forwards}
.ix-write{display:inline-block;animation:ixWrite .4s ease-out both}
.ix-underline{stroke-dasharray:100;stroke-dashoffset:100;animation:ixDraw .7s ease-out 1.4s forwards}
.ix-late{animation:ixRise .6s ease 2s both}
@keyframes ixWrite{from{opacity:0;clip-path:inset(0 100% 0 0);transform:translateY(6px)}to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@keyframes ixDraw{to{stroke-dashoffset:0}}
@keyframes ixIn{from{opacity:0}to{opacity:1}}
@keyframes ixLeave{to{transform:translateY(-100%)}}
@keyframes ixFade{from{opacity:0}to{opacity:1}}
@keyframes ixRise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ixRise2{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes ixHint{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes ixHint2{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes ixBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}
@keyframes ixRipple{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes ixFall{0%{transform:translate(0,-12vh) rotate(0deg)}100%{transform:translate(var(--dx,60px),112vh) rotate(var(--spin,360deg))}}
@keyframes ixBurst{0%{transform:scale(.1);opacity:1}70%{opacity:1}100%{transform:scale(1.3);opacity:0}}
@keyframes ixBloom{0%{opacity:1;transform:scale(0) rotate(var(--r))}22%{transform:scale(1.15) rotate(calc(var(--r) + 30deg))}32%{transform:scale(1) rotate(calc(var(--r) + 36deg))}60%{opacity:1;transform:translate(0,0) scale(1) rotate(calc(var(--r) + 50deg))}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.7) rotate(calc(var(--r) + 160deg))}}
@keyframes ixBloom2{0%{opacity:1;transform:scale(0) rotate(var(--r))}22%{transform:scale(1.15) rotate(calc(var(--r) + 30deg))}32%{transform:scale(1) rotate(calc(var(--r) + 36deg))}60%{opacity:1;transform:translate(0,0) scale(1) rotate(calc(var(--r) + 50deg))}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.7) rotate(calc(var(--r) + 160deg))}}
@keyframes ixFwFade{0%,70%{opacity:1}100%{opacity:0}}
@keyframes ixFwFade2{0%,70%{opacity:1}100%{opacity:0}}
@keyframes ixRay{0%{transform:rotate(var(--a)) translateY(0) scaleY(.3);opacity:1}100%{transform:rotate(var(--a)) translateY(var(--dist)) scaleY(1);opacity:0}}
@keyframes ixRay2{0%{transform:rotate(var(--a)) translateY(0) scaleY(.3);opacity:1}100%{transform:rotate(var(--a)) translateY(var(--dist)) scaleY(1);opacity:0}}
@keyframes ixCore{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.4);opacity:0}}
@keyframes ixCore2{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.4);opacity:0}}
@keyframes ixLeaf{0%{opacity:1;transform:translate(0,0) rotate(0deg)}80%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--spin))}}
@keyframes ixLeaf2{0%{opacity:1;transform:translate(0,0) rotate(0deg)}80%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--spin))}}
@keyframes ixSpark{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
@keyframes ixSpark2{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}

@supports (animation-timeline: view()){
@media (prefers-reduced-motion: no-preference){
.reveal{animation:revealUp linear both;animation-timeline:view();animation-range:entry 0% cover 22%}
}
}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl-Main">
<div class="grid-paper {{rootCls}}" style="font-family: 'Noto Sans TC', sans-serif; color: #3A3530; font-size: 16px; line-height: 1.75; min-height: 100vh">

<!-- 開場動畫：四季互動（元件在 Intro.dc.html） -->
<sc-if value="{{showIntro}}" hint-placeholder-val="{{ false }}">
<dc-import name="Intro" accent="{{accent}}" seconds="{{seasonSeconds}}" on-done="{{introDone}}" hint-size="100%,0px"></dc-import>
</sc-if>


<!-- 導覽列（捲動時固定） -->
<div style="position: sticky; top: 0; z-index: 30; background: rgba(251,246,236,0.92); backdrop-filter: blur(6px); border-bottom: 1.5px dashed #E0D5C0">
<header style="max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<a href="#top" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #3A3530">
<span aria-hidden="true" class="rot a-stamp" style="--r: -8deg; width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid {{accent}}; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'LXGW WenKai TC', serif; font-weight: 700; font-size: 22px">日</span>
<span style="font-family: 'LXGW WenKai TC', serif; font-size: 22px; font-weight: 700">凱倫的日語記事簿</span>
</a>
<nav aria-label="主選單" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; font-size: 15px">
<a href="#teacher" style="color: #3A3530; text-decoration: none">老師介紹</a>
<a href="#quiz" style="color: #3A3530; text-decoration: none">程度測驗</a>
<a href="#courses" style="color: #3A3530; text-decoration: none">開班資訊</a>
<a href="#faq" style="color: #3A3530; text-decoration: none">常見問題</a>
<a href="#contact" class="btn" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 10px 20px; border-radius: 999px; font-weight: 500; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">預約諮詢</a>
</nav>
</header>
</div>

<!-- 主視覺 -->
<div style="position: relative; overflow: hidden">
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<span class="petal" style="left: 4%; width: 14px; height: 10px; background: #F2C4C0; animation-duration: 12s; animation-delay: -1s; --dx: 120px; --spin: 320deg"></span>
<span class="petal" style="left: 13%; width: 10px; height: 8px; background: #F7D6D2; animation-duration: 15s; animation-delay: -7s; --dx: 60px; --spin: 420deg"></span>
<span class="petal" style="left: 22%; width: 12px; height: 9px; background: #F2C4C0; animation-duration: 11s; animation-delay: -4s; --dx: 140px; --spin: 280deg"></span>
<span class="petal" style="left: 34%; width: 9px; height: 7px; background: #F7D6D2; animation-duration: 14s; animation-delay: -10s; --dx: 90px; --spin: 380deg"></span>
<span class="petal" style="left: 47%; width: 13px; height: 10px; background: #F2C4C0; animation-duration: 13s; animation-delay: -2s; --dx: 110px; --spin: 300deg"></span>
<span class="petal" style="left: 58%; width: 10px; height: 8px; background: #F7D6D2; animation-duration: 16s; animation-delay: -12s; --dx: 70px; --spin: 460deg"></span>
<span class="petal" style="left: 68%; width: 12px; height: 9px; background: #F2C4C0; animation-duration: 12s; animation-delay: -6s; --dx: 130px; --spin: 340deg"></span>
<span class="petal" style="left: 79%; width: 9px; height: 7px; background: #F7D6D2; animation-duration: 14s; animation-delay: -3s; --dx: 80px; --spin: 400deg"></span>
<span class="petal" style="left: 88%; width: 14px; height: 10px; background: #F2C4C0; animation-duration: 13s; animation-delay: -9s; --dx: 50px; --spin: 300deg"></span>
<span class="petal" style="left: 95%; width: 10px; height: 8px; background: #F7D6D2; animation-duration: 17s; animation-delay: -5s; --dx: -40px; --spin: 360deg"></span>
</div>

<section id="top" style="position: relative; max-width: 1120px; margin: 0 auto; padding: 72px 24px 88px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px">
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 24px; align-items: flex-start">
<span class="rot a-tape" style="--r: -2deg; animation-delay: .1s; background: rgba(242,196,192,0.8); padding: 4px 18px; font-family: 'LXGW WenKai TC', serif; font-size: 16px; letter-spacing: 0.1em">ようこそ！歡迎來上課</span>
<h1 class="a-up" style="animation-delay: .25s; margin: 0; font-family: 'LXGW WenKai TC', serif; font-weight: 700; font-size: clamp(36px, 5vw, 56px); line-height: 1.3">把日本，<br>一點一點學進生活裡。</h1>
<p class="a-up" style="animation-delay: .45s; margin: 0; font-size: 17px; max-width: 480px">從粉專分享的日本生活情報出發，用最貼近日常的方式學日文。從五十音到 JLPT，一步一步陪你寫滿這本日文手帳。</p>
<div class="a-up" style="animation-delay: .65s; display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px">
<a href="#quiz" class="btn" style="background: {{accent}}; color: #FFFFFF; text-decoration: none; padding: 12px 28px; border-radius: 999px; font-weight: 500; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center">1 分鐘測出適合的班</a>
<a href="#courses" class="btn" style="background: #FFFDF8; color: #3A3530; text-decoration: none; padding: 12px 28px; border-radius: 999px; font-weight: 500; border: 1.5px solid #3A3530; min-height: 48px; box-sizing: border-box; display: inline-flex; align-items: center">看開班資訊</a>
</div>
</div>

<div class="a-up" style="animation-delay: .4s; flex: 1 1 380px; min-width: 0; display: flex; justify-content: center; position: relative; padding: 24px 0">
<div class="ruled" onMouseEnter="{{pause}}" onMouseLeave="{{resume}}" style="position: relative; width: 100%; max-width: 420px; padding: 52px 36px 28px 64px; box-sizing: border-box; box-shadow: 0 2px 0 #E6DCC8, 0 12px 28px rgba(58,53,48,0.10); transform: rotate(1.5deg)">
<div aria-hidden="true" style="position: absolute; left: 20px; top: 40px; bottom: 40px; display: flex; flex-direction: column; justify-content: space-between">
<span style="width: 14px; height: 14px; border-radius: 50%; background: #FBF6EC; box-shadow: inset 0 1px 2px rgba(58,53,48,0.25)"></span>
<span style="width: 14px; height: 14px; border-radius: 50%; background: #FBF6EC; box-shadow: inset 0 1px 2px rgba(58,53,48,0.25)"></span>
<span style="width: 14px; height: 14px; border-radius: 50%; background: #FBF6EC; box-shadow: inset 0 1px 2px rgba(58,53,48,0.25)"></span>
<span style="width: 14px; height: 14px; border-radius: 50%; background: #FBF6EC; box-shadow: inset 0 1px 2px rgba(58,53,48,0.25)"></span>
</div>
<span aria-hidden="true" class="rot a-tape" style="--r: -4deg; animation-delay: .7s; position: absolute; top: -14px; left: 50%; width: 120px; height: 30px; margin-left: -60px; background: rgba(191,211,168,0.85)"></span>
<p style="margin: 0 0 8px; font-family: 'LXGW WenKai TC', serif; font-size: 15px; color: #6B6259">今日の一言 ／ 今日一句　{{phraseNo}}</p>
<div class="{{phraseClass}}" aria-live="polite" style="min-height: 196px">
<p lang="ja" style="margin: 0; font-family: 'LXGW WenKai TC', serif; font-size: 30px; line-height: 1.45; font-weight: 700">{{phrase.jp}}</p>
<p style="margin: 0 0 14px; font-family: 'LXGW WenKai TC', serif; font-size: 17px; color: #6B6259">{{phrase.romaji}}／{{phrase.zh}}</p>
<p style="margin: 0; font-family: 'LXGW WenKai TC', serif; font-size: 16px; line-height: 36px; max-width: 250px">{{phrase.note}}</p>
</div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
<button type="button" class="icon-btn" onClick="{{prev}}" aria-label="上一句" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #3A3530; background: #FFFDF8; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A3530" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button type="button" class="icon-btn" onClick="{{speak}}" style="height: 44px; border-radius: 999px; border: 1.5px solid #3A3530; background: #FFFDF8; display: flex; align-items: center; gap: 6px; padding: 0 16px; cursor: pointer; font-size: 15px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A3530" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 6a8.5 8.5 0 0 1 0 12"></path></svg>聽發音</button>
<button type="button" class="icon-btn" onClick="{{next}}" aria-label="下一句" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #3A3530; background: #FFFDF8; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A3530" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
<span aria-hidden="true" class="rot a-stamp" style="--r: -14deg; animation-delay: 1.1s; position: absolute; right: 18px; top: 64px; width: 76px; height: 76px; border-radius: 50%; border: 2.5px solid {{accent}}; color: {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'LXGW WenKai TC', serif; font-weight: 700; font-size: 15px; line-height: 1.2; text-align: center; opacity: 0.85">がんばっ<br>て！</span>
</div>
<div aria-hidden="true" class="rot a-float" style="--r: -6deg; position: absolute; left: -12px; bottom: -14px; width: 150px; padding: 14px 16px; background: #FCEBB6; box-shadow: 0 6px 14px rgba(58,53,48,0.12); font-family: 'LXGW WenKai TC', serif; font-size: 15px; line-height: 1.5">N5 → N3<br>一起加油！</div>
</div>
</section>
</div>

<!-- 紙膠帶跑馬燈 -->

<section id="contact" style="max-width: 1120px; margin: 0 auto; padding: 72px 24px 96px">

        pressed: on ? 'true' : 'false',
        label: k.k + '，翻面看讀音和單字',
        cls: on ? 'flip-inner is-flipped' : 'flip-inner',
        toggle: function () {
          var f = Object.assign({}, self.state.flipped);
          f[i] = !f[i];
          self.setState({ flipped: f });
          if (f[i]) { self.say(k.word); }
        }
      });
    });

    var step = s.answers.length;
    var quizAsking = step < QUIZ.length;
    var marks = ['あ', 'い', 'う'];
    var quizOpts = quizAsking ? QUIZ[step].opts.map(function (t, i) {
      return { text: t, mark: marks[i], pick: function () { self.setState({ answers: self.state.answers.concat([i]), quizTick: self.state.quizTick + 1 }); } };
    }) : [];
    var result = { name: '', reason: '', time: '', ask: function () {} };
    if (!quizAsking) {
      var a = s.answers;
      if (a[0] === 0) { result.name = '五十音入門班'; result.reason = '先把五十音和發音打穩，之後學什麼都會輕鬆很多。'; }
      else if (a[1] === 0) { result.name = '日本旅遊會話班'; result.reason = '你已經有基礎了，直接用旅遊情境練開口，下次去日本就用得上！'; }
      else { result.name = 'N4–N3 文法實力班'; result.reason = '把文法系統整理一次，考檢定、看日本資訊都更有把握。'; }
      result.time = ['每週 1 小時也沒問題，重點是持續。', '每週 2～3 小時，進步會很有感。', '時間充裕的話，搭配課後練習會進步更快。'][a[2]];
      var picked = result.name;
      result.ask = function () { self.setState({ formCourse: picked }); };
    }

    var tabs = TABS.map(function (t) {
      var on = s.filter === t.id;
      return {
        label: t.label,
        pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ filter: t.id, filterTick: self.state.filterTick + 1 }); },
        style: 'min-height: 44px; padding: 8px 20px; border-radius: 999px; cursor: pointer; font-size: 15px; transition: background .2s, color .2s; border: 1.5px solid ' + (on ? accent : '#3A3530') + '; background: ' + (on ? accent : '#FFFDF8') + '; color: ' + (on ? '#FFFFFF' : '#3A3530')
      };
    });
    var cardCls = 'card ' + (s.filterTick % 2 ? 'cardB' : 'cardA');
    var courses = COURSES.filter(function (c) { return s.filter === 'all' || c.cat === s.filter; }).map(function (c, i) {
      return Object.assign({}, c, {
        cls: cardCls,
        delay: (i * 0.1) + 's',
        ask: function () { self.setState({ formCourse: c.name }); }
      });
    });

    var levelNames = ['完全沒學過', '會五十音', 'N5–N4', 'N3 以上'];
    var levels = levelNames.map(function (name) {
      var on = s.level === name;
      return {
        label: name,
        checked: on,
        pick: function () { self.setState({ level: name }); },
        chip: 'position: relative; display: inline-flex; align-items: center; min-height: 44px; box-sizing: border-box; padding: 8px 18px; border-radius: 999px; cursor: pointer; font-size: 15px; transition: background .2s, color .2s; border: 1.5px solid ' + (on ? accent : '#3A3530') + '; background: ' + (on ? accent : 'transparent') + '; color: ' + (on ? '#FFFFFF' : '#3A3530')
      };
    });

    var introOn = (this.props.intro ?? true) && s.introPhase !== 'done';

    return {
      accent: accent,
      showIntro: introOn,
      rootCls: introOn ? 'is-intro' : '',
      seasonSeconds: this.props.seasonSeconds ?? 4,
      introDone: function () { self.setState({ introPhase: 'done' }); },
      replayIntro: function () {
        try { window.scrollTo(0, 0); } catch (e) {}
        self.setState({ introPhase: 'playing' });
      },
      phrase: PHRASES[s.phrase],
      phraseNo: (s.phrase + 1) + ' / ' + PHRASES.length,
      phraseClass: s.tick % 2 ? 'pageB' : 'pageA',
      prev: function () { self.go(-1); },
      next: function () { self.go(1); },
      speak: function () { self.say(PHRASES[self.state.phrase].jp); },
      pause: function () { self.setState({ paused: true }); },
      resume: function () { self.setState({ paused: false }); },
      kana: kana,
      quizAsking: quizAsking,
      quizDone: !quizAsking,
      quizNo: Math.min(step + 1, QUIZ.length),
      quizPct: Math.round((step / QUIZ.length) * 100) + '%',
      quizQ: quizAsking ? QUIZ[step].q : '',
      quizOpts: quizOpts,
      quizClass: s.quizTick % 2 ? 'pageB' : 'pageA',
      quizReset: function () { self.setState({ answers: [], quizTick: self.state.quizTick + 1 }); },
      result: result,
      tabs: tabs,
      courses: courses,
      faqs: [
        { q: '完全沒學過日文，可以報名嗎？', a: '[你的回答，例如：可以，建議從五十音入門班開始。]' },
        { q: '線上課程用什麼平台？需要準備什麼？', a: '[你的回答，例如：使用 Google Meet，準備電腦與耳機即可。]' },
        { q: '請假或錯過課程怎麼辦？', a: '[你的回答，例如：每堂課都有錄影，可於一週內回看。]' },
        { q: '要怎麼繳費？可以分期嗎？', a: '[你的回答，例如：銀行轉帳，開課前一週完成繳費。]' }
      ],
      formCourse: s.formCourse,
      setCourse: function (e) { self.setState({ formCourse: e.target.value }); },
      levels: levels,
      showForm: !s.sent,
      showThanks: s.sent,
      submit: function (e) { if (e && e.preventDefault) { e.preventDefault(); } self.setState({ sent: true }); },
      reset: function () { self.setState({ sent: false }); }
    };
  }
}

DC.define('Main', Component);
})();
DC.mount('Main', document.getElementById('app'), {});
</script>
</body>
</html>
