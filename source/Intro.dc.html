<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4472F"},"seconds":{"editor":"int","default":4,"min":2,"max":10},"onDone":{"editor":null},"$preview":{"width":1440,"height":900}}'>

];
var HINTS = [
  { fine: '移動滑鼠，在畫面上畫出櫻花', coarse: '用手指在畫面上滑動，畫出櫻花', done: '好漂亮！繼續畫，或前往下一季' },

  { fine: '滑鼠滑過落葉，把楓葉撥開', coarse: '用手指滑過落葉，把楓葉撥開', done: '沙沙沙～這就是秋天的聲音' },

];
var COLS = 12, ROWS = 7;
var BLOOM = ['#F2B8B5', '#F7D0CC', '#EFA9A8', '#FFFFFF'];
var FW = ['#F2C4C0', '#FCEBB6', '#B9D4E0', '#F6A6A0', '#FFFFFF'];
var LEAF = ['#C8553D', '#D98A3A', '#B4472F', '#E0A33C'];
var FOG_FULL = [];
for (var i = 0; i < COLS * ROWS; i++) { FOG_FULL.push(false); }

var RAYS = 14;
function makePool(n, withRays) {
  var a = [];
  for (var i = 0; i < n; i++) {
    var rays = [];
    if (withRays) { for (var j = 0; j < RAYS; j++) { rays.push({ style: '' }); } }
    a.push({ gen: 0, kind: '', x: 0, y: 0, size: 0, color: '#FFFFFF', r: 0, dx: 0, dy: 0, spin: 0, rays: rays });

function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

class Component extends DCLogic {
  constructor(props) {

    var coarse = false;

    this.pools = { bloom: makePool(36, false), leaf: makePool(40, false), spark: makePool(24, false), fw: makePool(6, true) };
    this.ptr = { bloom: 0, leaf: 0, spark: 0, fw: 0 };
    this.downAt = 0;
    this.state = { season: 0, pools: this.pools, fog: FOG_FULL.slice(), leaving: false, played: [false, false, false, false], coarse: coarse };
    this.last = { x: -999, y: -999, t: 0 };
  }
  componentDidMount() { this.startTimer(); }
  componentWillUnmount() {
    clearTimeout(this.t); clearTimeout(this.leaveT);
  }
  secs() { return (this.props.seconds ?? 4) * 1000; }
  startTimer(ms) {
    var self = this;

    var dur = ms || (this.state.season < 4 ? this.secs() : 4000);
    this.deadline = Date.now() + dur;

  }
  bump() {
    if (this.state.season < 4 && this.deadline - Date.now() < 2500) { this.startTimer(2500); }

    }, 850);
  }
  markPlayed() {
    var s = this.state.season;
    if (s < 4 && !this.state.played[s]) {
      var p = this.state.played.slice(); p[s] = true;
      this.setState({ played: p });
    }
    this.bump();
  }
  put(kind, items) {
    var pool = this.pools[kind].slice();
    for (var i = 0; i < items.length; i++) {
      var slot = this.ptr[kind] % pool.length;
      this.ptr[kind] += 1;
      pool[slot] = Object.assign({}, items[i], { gen: pool[slot].gen + 1 });
    }
    var next = Object.assign({}, this.pools);
    next[kind] = pool;
    this.pools = next;
    this.setState({ pools: next });
  }
  item(kind, x, y, size, extra) {
    return Object.assign({ kind: kind, x: x, y: y, size: size }, extra || {});
  }
  spawnBloom(x, y, n) {
    var arr = [];
    for (var i = 0; i < n; i++) {
      arr.push(this.item('bloom', x + rnd(-14, 14), y + rnd(-14, 14), rnd(22, 40), { color: pick(BLOOM), r: rnd(0, 72), dx: rnd(-40, 40), dy: rnd(60, 140) }));

    this.put('bloom', arr);
  }
  spawnFirework(x, y) {
    var color = pick(FW);
    var rays = [];
    var count = RAYS;
    for (var i = 0; i < count; i++) {
      var c = i % 3 === 0 ? pick(FW) : color;

  }

    for (var i = 0; i < n; i++) {

      arr.push(this.item('leaf', x + rnd(-10, 10), y + rnd(-10, 10), rnd(20, 32), { color: pick(LEAF), dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist + 40, spin: rnd(-540, 540) }));

    var el = e.currentTarget;

    return { x: e.clientX - rect.left, y: e.clientY - rect.top, w: rect.width, h: rect.height };

  renderVals() {

    var st = this.state;
    var accent = this.props.accent ?? '#B4472F';
    var s = SEASONS[st.season];
    var coarse = st.coarse;

    var tabs = SEASONS.slice(0, 4).map(function (se, i) {

        k: se.k, label: '切換到' + se.label, pressed: on ? 'true' : 'false',
        pick: function () { self.goTo(i); },
        style: 'width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-family: \'LXGW WenKai TC\', serif; font-weight: 700; font-size: 18px; padding: 0; border: 2px solid ' + (on ? accent : '#3A3530') + '; background: ' + (on ? accent : 'rgba(255,253,248,0.92)') + '; color: ' + (on ? '#FFFFFF' : '#3A3530')

    function base(f) {
      return 'position: absolute; left: ' + Math.round(f.x) + 'px; top: ' + Math.round(f.y) + 'px; width: ' + Math.round(f.size) + 'px; height: ' + Math.round(f.size) + 'px; margin-left: ' + Math.round(-f.size / 2) + 'px; margin-top: ' + Math.round(-f.size / 2) + 'px';

    var P = st.pools;
    var blooms = P.bloom.map(function (f) {
      return { color: f.color, cls: f.gen ? 'ix-bloom ' + par(f.gen) : 'ix-off', style: base(f) + '; --r: ' + Math.round(f.r) + 'deg; --dx: ' + Math.round(f.dx) + 'px; --dy: ' + Math.round(f.dy) + 'px' };
    });
    var leaves = P.leaf.map(function (f) {
      return { color: f.color, cls: f.gen ? 'ix-leaf ' + par(f.gen) : 'ix-off', style: base(f) + '; --dx: ' + Math.round(f.dx) + 'px; --dy: ' + Math.round(f.dy) + 'px; --spin: ' + Math.round(f.spin) + 'deg' };
    });
    var sparks = P.spark.map(function (f) {
      return { color: f.color, cls: f.gen ? 'ix-spark ' + par(f.gen) : 'ix-off', style: base(f) + '; --dx: ' + Math.round(f.dx) + 'px; --dy: ' + Math.round(f.dy) + 'px' };
    });
    var fireworks = P.fw.map(function (f) {
      var on = f.gen > 0;
      return {
        color: f.color,
        cls: on ? 'ix-fw ' + par(f.gen) : 'ix-off',
        coreCls: on ? 'ix-core ' + par(f.gen) : 'ix-off',
        style: base(f),
        rays: f.rays.map(function (r) { return { style: r.style, cls: on ? 'ix-ray ' + par(f.gen) : 'ix-off' }; })
      };
    });

    var fog = st.fog.map(function (cleared, i) {
      var c = i % COLS, r = Math.floor(i / COLS);
      return { style: 'position: absolute; left: ' + (c * 100 / COLS) + '%; top: ' + (r * 100 / ROWS) + '%; width: ' + (100 / COLS) + '%; height: ' + (100 / ROWS) + '%; background: radial-gradient(closest-side, rgba(228,234,239,0.96) 50%, rgba(228,234,239,0)); transform: scale(1.9); transition: opacity .7s ease; opacity: ' + (cleared ? 0 : 1) };
    });
    var clearedCount = st.fog.filter(function (v) { return v; }).length;

    var hint = '';
    if (st.season < 4) {
      var h = HINTS[st.season];
      hint = st.played[st.season] ? h.done : (coarse ? h.coarse : h.fine);
      if (st.season === 3 && clearedCount > COLS * ROWS * 0.45) { hint = '看見富士山了！準備好就前往下一步吧'; }
    }

    var nextLabel = st.season < 3 ? '下一季' : (st.season === 3 ? '下一步' : '進入網站');

    return {
      accent: accent,
      s: s,
      rootCls: st.leaving ? 'ix-root ix-leave' : 'ix-root',
      cursor: st.season === 1 ? 'pointer' : 'crosshair',
      isSpring: st.season === 0,
      isSummer: st.season === 1,
      isAutumn: st.season === 2,
      isWinter: st.season === 3,
      isFinal: st.season === 4,
      showSeasonText: st.season < 4,
      textCls: 'ix-scene ix-t' + (st.season % 2),
      fog: fog,
      blooms: blooms,
      leaves: leaves,
      sparks: sparks,
      fireworks: fireworks,
      ambFw: !st.played[1],
      showHint: st.season < 4,
      hintCls: 'ix-hint ix-h' + ((st.season + (st.played[st.season] ? 1 : 0)) % 2),
      hint: hint,
      coarse: coarse,
      fine: !coarse,
      tabs: tabs,
      nextLabel: nextLabel,
      progress: Math.round((st.season / 4) * 100) + '%',
      next: function () { self.next(); },
      skip: function () { self.leave(); },
      onDown: function (e) {
        if (self.isControl(e)) { return; }
        var p = self.pos(e);
        var sea = self.state.season;
        self.downAt = Date.now();
        if (sea === 0) { self.spawnBloom(p.x, p.y, 4); }
        else if (sea === 1) { self.spawnFirework(p.x, p.y); }
        else if (sea === 2) { self.spawnLeaves(p.x, p.y, 7); }
        else if (sea === 3) { self.wipe(p.x, p.y, p.w, p.h); }
        else { return; }
        self.last = { x: p.x, y: p.y, t: Date.now() };
        self.markPlayed();
      },
      onMove: function (e) {
        if (self.isControl(e)) { return; }
        var sea = self.state.season;
        if (sea > 3) { return; }
        var now = Date.now();
        if (sea === 1 && ((e.pointerType === 'mouse' && e.buttons) || now - self.downAt < 350)) { return; }
        var p = self.pos(e);
        var dx = p.x - self.last.x, dy = p.y - self.last.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        var gap = sea === 3 ? 30 : 45;
        var need = sea === 3 ? 18 : 28;
        if (now - self.last.t < gap || dist < need) { return; }
        self.last = { x: p.x, y: p.y, t: now };
        if (sea === 0) { self.spawnBloom(p.x, p.y, 1); }
        else if (sea === 1) { self.spawnSpark(p.x, p.y); return; }
        else if (sea === 2) { self.spawnLeaves(p.x, p.y, 2); }
        else { self.wipe(p.x, p.y, p.w, p.h); }
        self.markPlayed();
      }
    };
  }
}
</script>
